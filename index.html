<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14161b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Patchbay"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style></head><body>
<title>Patchbay Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@700;900&family=Bungee&family=Major+Mono+Display&family=Audiowide&family=Righteous&display=swap">
<style>
/* Layout: a tape-machine transport strip on top, library rail beside the arrangement, and a resizable console dock underneath (editor / devices / mixer). One deliberate dark look. */
:root{
  --bg:#14161b; --panel:#1b1e25; --raise:#242832; --raise-2:#2c313d; --sunk:#0f1115;
  --line:#2d323e; --line-2:#3b4252; --grid:#22262f; --grid-bar:#343a48;
  --fg:#e7e3d7; --dim:#8b909d; --faint:#5c6170; --ink:#101218;
  --accent:#f0a33c; --accent-ink:#1b1306; --rec:#e2574c; --ok:#5fbf86; --cue:#79aefc;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --hw:196px; --rowh:64px; --dock-h:300px;
  color-scheme:dark;
}
/* Skins: each redefines the full token set. Tape (above) is the default. */
:root[data-skin="midnight"]{--bg:#0b1020;--panel:#111831;--raise:#18213f;--raise-2:#1f2a50;--sunk:#070b17;--line:#232e52;--line-2:#2f3c68;--grid:#141c38;--grid-bar:#26305a;--fg:#dfe7ff;--dim:#8a97c0;--faint:#59658c;--accent:#4fd1ff;--accent-ink:#04212c;--cue:#a78bfa}
:root[data-skin="synthwave"]{--bg:#160d24;--panel:#1e1230;--raise:#2a1a42;--raise-2:#352154;--sunk:#0f0819;--line:#3a2559;--line-2:#4b3170;--grid:#22153a;--grid-bar:#3a2560;--fg:#f6e8ff;--dim:#b49ad0;--faint:#7a6496;--accent:#ff4fa3;--accent-ink:#2a0517;--cue:#6ee7ff}
:root[data-skin="console"]{--bg:#1a1410;--panel:#231b15;--raise:#2e241c;--raise-2:#3a2e24;--sunk:#120d0a;--line:#3d3026;--line-2:#4f3f32;--grid:#261d16;--grid-bar:#43352a;--fg:#f1e4cf;--dim:#b09a7e;--faint:#7d6a55;--accent:#e5733a;--accent-ink:#1f0d04;--ok:#9cc56b;--cue:#6fb3d2}
:root[data-skin="mono"]{--bg:#000;--panel:#0b0b0b;--raise:#161616;--raise-2:#222;--sunk:#000;--line:#2e2e2e;--line-2:#4a4a4a;--grid:#141414;--grid-bar:#2c2c2c;--fg:#fff;--dim:#a8a8a8;--faint:#707070;--accent:#fff;--accent-ink:#000;--cue:#8ab4ff}
:root[data-skin="daylight"]{--bg:#e8e5df;--panel:#f6f4f0;--raise:#fff;--raise-2:#efece6;--sunk:#dcd8d0;--line:#cfcac0;--line-2:#b5afa3;--grid:#dfdbd3;--grid-bar:#c6c0b4;--fg:#1d1f24;--dim:#5b5f6b;--faint:#8a8e99;--accent:#0f7f74;--accent-ink:#fff;--rec:#d23b30;--ok:#2f9a5a;--cue:#2f6fd6;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cue);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column;gap:6px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;background:var(--raise);border:1px solid var(--line);border-radius:4px;cursor:pointer;font:600 12px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:var(--raise-2);border-color:var(--line-2)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.rec.on{background:var(--rec);border-color:var(--rec);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:14px;height:14px;flex:none}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn:disabled{opacity:.45;cursor:default}
.ib{width:22px;height:22px;display:inline-grid;place-items:center;background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;color:var(--dim);font:600 13px/1 var(--f-display);padding:0}
.ib:hover{color:var(--fg);border-color:var(--line-2)}
.tog{height:20px;min-width:22px;padding:0 5px;border-radius:3px;border:1px solid var(--line-2);background:var(--sunk);cursor:pointer;font:700 11px/1 var(--f-display);color:var(--dim)}
.tog.m.on{background:var(--cue);border-color:var(--cue);color:var(--ink)}
.tog.s.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select.sel{height:28px;background:var(--sunk);border:1px solid var(--line-2);border-radius:4px;padding:0 6px;font-size:13px;max-width:100%}
.lbl-k{font:600 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

/* transport */
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font:700 19px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.brand b span{color:var(--accent)}
.brand input{width:150px;min-width:0;background:transparent;border:1px solid transparent;border-radius:3px;padding:3px 5px;color:var(--dim);font-size:13px}
.brand input:hover,.brand input:focus{border-color:var(--line-2);color:var(--fg)}
.tgroup{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lcd{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:3px 10px;font-family:var(--f-mono);display:flex;gap:12px;align-items:baseline;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 #00000040}
#posBars{color:var(--accent);font-size:17px;font-weight:600;min-width:7.5ch}
#posTime{color:var(--dim);font-size:12px;min-width:8ch}
.bpm{display:flex;align-items:center;gap:6px}
.bpm input{width:58px;height:28px;background:var(--sunk);border:1px solid var(--line-2);border-radius:4px;padding:0 6px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.mmeter{width:90px;height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.mmeter i,.tmeter i,.vm i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--ok) 0 70%,var(--accent) 70% 90%,var(--rec) 90%);transform-origin:left;transform:scaleX(0)}
.spacer{flex:1}
#btnLib,#libClose{display:none}

/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr);gap:6px}
#lib{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;min-width:0}
.libtabs,.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 6px;align-items:stretch;flex:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px 6px;cursor:pointer;font:600 12px/1 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
#libBody{flex:1;overflow:auto;padding:6px 6px 12px;min-height:0}
.grp{font:600 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 6px 6px;display:flex;justify-content:space-between;align-items:center}
.li{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 6px;border-radius:4px;cursor:grab;user-select:none;min-width:0}
.li:hover{background:var(--raise)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.li .du{font:11px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.li .ib{flex:none}
.li .kind{font:600 10px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:3px 4px;border-radius:2px;background:var(--sunk);color:var(--dim)}
.li.user .kind{color:var(--accent)}
.patctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;padding:8px 6px 2px}
.li .pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li .sub{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib.on{color:var(--accent);border-color:var(--accent)}
.grp[data-cat]{padding:0;margin-top:2px}
.grpbtn{flex:1;display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:4px;padding:7px 6px;cursor:pointer;color:var(--dim);font:600 11px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-align:left}
.grpbtn:hover{background:var(--raise);color:var(--fg)}
.grp.open .grpbtn{color:var(--fg)}
.chev{display:inline-block;width:10px;color:var(--accent);transition:transform .15s ease}
.grp.open .chev{transform:rotate(90deg)}
.gname{flex:1}
.gcount{font:11px var(--f-mono);letter-spacing:0;color:var(--faint);text-transform:none}
.libtools{display:flex;gap:12px;justify-content:flex-end;padding:0 4px 4px}
.linkbtn{background:none;border:0;color:var(--dim);font-size:12px;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.libsearch{width:100%;height:30px;margin:2px 0 4px;padding:0 10px;background:var(--sunk);border:1px solid var(--line-2);border-radius:4px;color:var(--fg);font-size:13px}
.libnote{font-size:12px;color:var(--dim);padding:4px 6px 8px;line-height:1.45}
.libbtns{display:flex;flex-direction:column;gap:6px;padding:6px}
.libbtns .btn{justify-content:center}

/* arrangement */
.arrwrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.arrbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.arrbar label{display:flex;align-items:center;gap:6px}
#arr{flex:1;overflow:auto;position:relative;min-height:0;background:var(--bg)}
#arrInner{position:relative;min-height:100%}
.ruler-row{position:sticky;top:0;z-index:6;display:flex;height:36px;background:var(--panel);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:7;width:var(--hw);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 10px}
#ruler{position:relative;flex:none;cursor:zoom-in;touch-action:none;user-select:none}
#ruler:hover{background:color-mix(in srgb,var(--fg) 3%,var(--panel))}
#loopstrip{position:absolute;left:0;right:0;top:0;height:12px;cursor:pointer;background:color-mix(in srgb,#000 22%,var(--panel));border-bottom:1px solid var(--line)}
#ruler .bar{position:absolute;top:12px;bottom:0;border-left:1px solid var(--line-2);padding:6px 0 0 4px;font:600 11px/1 var(--f-mono);color:var(--dim);pointer-events:none}
#loopband{position:absolute;top:2px;height:8px;background:var(--accent);opacity:.9;border-radius:2px;cursor:grab}
#loopband::before,#loopband::after{content:"";position:absolute;top:-2px;bottom:-2px;width:7px;cursor:ew-resize}
#loopband::before{left:-3px}#loopband::after{right:-3px}
body.zooming,body.zooming *{cursor:zoom-in!important}body.bracing,body.bracing *{cursor:grabbing!important}
#loopShade{position:absolute;top:36px;bottom:0;z-index:0;background:var(--accent);opacity:.05;pointer-events:none}
.row{display:flex;height:var(--rowh);border-bottom:1px solid var(--line)}
.thead{position:sticky;left:0;z-index:4;width:var(--hw);flex:none;display:flex;background:var(--panel);border-right:1px solid var(--line);cursor:default}
.row.sel .thead{background:var(--raise)}
.tcolor{width:6px;flex:none;border:0;background:var(--c);cursor:pointer;padding:0}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:5px 6px 5px 8px}
.trow1,.trow2{display:flex;align-items:center;gap:4px;min-width:0}
.tname{flex:1;min-width:0;font:600 14px/1.2 var(--f-display);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname input{width:100%;background:var(--sunk);border:1px solid var(--line-2);border-radius:3px;font:inherit;padding:0 3px}
.chip{flex:1;min-width:0;height:20px;border:1px solid var(--line);background:var(--sunk);border-radius:3px;cursor:pointer;font:500 11px/18px var(--f-body);color:var(--dim);text-align:left;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.tmeter{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.lane{position:relative;flex:none;background-image:linear-gradient(to right,var(--grid-bar) 1px,transparent 1px),linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:calc(var(--z)*4px) 100%,calc(var(--z)*1px) 100%}
.row.sel .lane{background-color:#ffffff05}
.clip{position:absolute;top:3px;bottom:3px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,var(--sunk));border:1px solid color-mix(in srgb,var(--c) 65%,transparent);overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.clip .cl{position:absolute;left:0;right:0;top:0;height:15px;background:var(--c);color:var(--ink);font:600 11px/15px var(--f-display);letter-spacing:.03em;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.missing .cl{background:var(--rec)}
.clip canvas{position:absolute;left:0;top:15px;width:100%;height:calc(100% - 15px)}
.clip.sel{outline:2px solid var(--fg);outline-offset:-1px}
.clip .rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize}
.clip .rz:hover{background:#ffffff22}
#playhead{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:var(--accent);z-index:5;pointer-events:none;box-shadow:0 0 6px #f0a33c66}
.addrow{display:flex;min-height:84px}
.addrow .thead{flex-direction:column;gap:6px;padding:10px 8px;background:var(--panel)}
.addrow .thead .btn{justify-content:center}
.dropzone{flex:1;display:flex;align-items:center;padding:0 16px;color:var(--faint);font-size:13px;position:sticky;left:var(--hw);max-width:calc(100vw - var(--hw) - 40px)}

/* dock */
#dockHandle{height:6px;flex:none;cursor:ns-resize;display:grid;place-items:center;touch-action:none}
#dockHandle::after{content:"";width:44px;height:3px;border-radius:2px;background:var(--line-2)}
#dock{height:var(--dock-h);flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dtabs .dctx{margin-left:auto;align-self:center;font:500 12px var(--f-body);color:var(--dim);padding-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#dockBody{flex:1;min-height:0;overflow:auto;position:relative}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--dim);padding:20px;font-size:13px;line-height:1.5}
.empty b{display:block;font:600 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);margin-bottom:4px}

/* editor */
.editor{display:flex;flex-direction:column;height:100%;min-height:0}
.edbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
.edbar label{display:flex;align-items:center;gap:6px}
.edbar .nm{height:28px;width:150px;background:var(--sunk);border:1px solid var(--line-2);border-radius:4px;padding:0 8px}
.hint{font-size:12px;color:var(--faint)}
.prwrap{flex:1;overflow:auto;min-height:0;position:relative}
.prinner{display:flex;position:relative;width:max-content}
.prkeys{position:sticky;left:0;z-index:2;flex:none;cursor:pointer}
.prgrid{flex:none;cursor:crosshair;touch-action:none}
.prph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;z-index:1}
.wavebox{flex:1;min-height:0;padding:10px;display:flex}
.wavebox canvas{width:100%;height:100%;min-height:80px;background:var(--sunk);border:1px solid var(--line);border-radius:4px}
.range{display:flex;align-items:center;gap:6px}
.range input{width:120px;accent-color:var(--accent)}
.range output{font:12px var(--f-mono);color:var(--dim);min-width:6ch;font-variant-numeric:tabular-nums}

/* devices */
.rack{display:flex;gap:8px;padding:10px;align-items:flex-start;min-height:100%;width:max-content;min-width:100%}
.dev{flex:none;background:var(--raise);border:1px solid var(--line);border-radius:5px;min-width:170px;max-width:440px}
.kgrp{grid-column:1/-1;font:600 10px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding-top:6px;border-top:1px solid var(--line);margin-top:2px}
.kgrp:first-child{border-top:0;margin-top:0;padding-top:0}
.presetrow{display:flex;align-items:center;gap:8px;padding:8px 10px 0}
.presetrow .sel{flex:1}
.arprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 10px 0;padding:6px 8px;border-radius:4px;border:1px dashed var(--fline,var(--line))}
.arprow.on{border-style:solid;border-color:var(--arc,var(--accent));background:color-mix(in srgb,var(--arc,var(--accent)) 10%,transparent)}
.arprow .sel{height:24px;font-size:12px;max-width:160px}
.arprow .sel:disabled{opacity:.45}
.dev.inst{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.dev.off .knobs{opacity:.4}
.devh{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 10px;border-bottom:1px solid var(--line);font:700 13px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;min-height:34px}
.devh .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devh .sel{height:24px;font:600 12px var(--f-display);letter-spacing:.05em;text-transform:uppercase;flex:1}
.pw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);background:var(--sunk);cursor:pointer;padding:0;display:grid;place-items:center}
.pw::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pw.on::after{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.knobs{display:grid;gap:10px 6px;padding:10px;justify-content:start}
.dev .note{font-size:12px;color:var(--dim);padding:10px;max-width:260px;line-height:1.45}
.dev.add{padding-bottom:10px;min-width:200px}
.dev.add .sel{margin:0 10px;width:calc(100% - 20px)}
.pads{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 10px 10px}
.pad{height:34px;border-radius:3px;border:1px solid var(--line-2);background:var(--sunk);cursor:pointer;font:600 10px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--dim);padding:2px}
.pad:active{background:var(--accent);color:var(--accent-ink)}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;width:58px;cursor:ns-resize;touch-action:none;user-select:none;border-radius:4px;padding:2px 0}
.knob svg{width:40px;height:40px}
.knob .kt{fill:none;stroke:var(--track,var(--sunk));stroke-width:4;stroke-linecap:round}
.knob .kv{fill:none;stroke:var(--arc,var(--accent));stroke-width:4;stroke-linecap:round}
.knob .kc{fill:var(--cap,var(--raise-2))}
.knob .kp{stroke:var(--ptr,var(--fg));stroke-width:2;stroke-linecap:round}
.knob .kval{font:11px/1.2 var(--f-mono);color:var(--fink,var(--fg));font-variant-numeric:tabular-nums;white-space:nowrap}
.knob .klab{font:600 10px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--fdim,var(--dim));text-align:center}
/* plugin faceplates: each card sets its own --face/--fink/--arc… */
.dev{background:var(--face,var(--raise));color:var(--fink,var(--fg));border-color:var(--fline,var(--line))}
.dev .devh{background:var(--hdr,transparent);color:var(--hdrInk,inherit);border-bottom-color:var(--fline,var(--line));border-radius:4px 4px 0 0}
.dev .kgrp{color:var(--arc,var(--accent));border-top-color:var(--fline,var(--line))}
.dev .sel{background:var(--ctl,var(--sunk));border-color:var(--fline,var(--line-2));color:var(--fink,var(--fg))}
.dev .devh .sel{background:transparent;border-color:color-mix(in srgb,currentColor 35%,transparent);color:inherit}
.dev .devh .ib{color:inherit;opacity:.75}
.dev .ib,.dev .lbl-k,.dev .note{color:var(--fdim,var(--dim))}
.dev .pw{background:var(--ctl,var(--sunk));border-color:color-mix(in srgb,currentColor 35%,transparent)}
.dev .pw.on::after{background:var(--arc,var(--accent));box-shadow:0 0 6px var(--arc,var(--accent))}
.dev .pad{background:color-mix(in srgb,var(--pc,var(--arc)) 28%,var(--ctl,var(--sunk)));border-color:color-mix(in srgb,var(--pc,var(--arc)) 60%,transparent);color:var(--fink,var(--fg))}
.dev .pad:active{background:var(--pc,var(--accent));color:#111}
.dev .display{display:block;margin:10px 10px 0;width:calc(100% - 20px);height:62px;contain:size;border-radius:4px;background:var(--disp,#0005);border:1px solid var(--fline,var(--line))}
.dev .lcd2{margin:10px 10px 0;padding:6px 9px;border-radius:3px;background:#a3b78d;color:#17220f;font:600 12px/1.35 var(--f-mono);box-shadow:inset 0 2px 5px #0005;white-space:pre}
.dev[data-look="synth"]{padding:0 9px}
.dev[data-look="acid"] .devh,.dev[data-look="ratio"] .devh{letter-spacing:.16em}
.dev[data-look="boom808"] .devh{font-style:italic}
.dev[data-look="spectra"]{box-shadow:0 0 0 1px #b48cff22,0 8px 24px #3b1d7a33}
.kselect{display:flex;flex-direction:column;gap:3px;grid-column:span 2}
.kselect .sel{height:26px;font-size:12px}

/* mixer */
.mixer{display:flex;gap:6px;padding:10px;height:100%;width:max-content;min-width:100%}
.strip{flex:none;width:86px;background:var(--raise);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:5px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 5px 8px;min-height:0}
.strip.sel{background:var(--raise-2)}
.strip.master{--c:var(--accent);width:96px}
.sname{font:600 13px/1.1 var(--f-display);letter-spacing:.04em;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz{flex:1;display:flex;gap:6px;min-height:60px;align-items:stretch}
.vm{width:7px;background:var(--sunk);border-radius:2px;overflow:hidden;display:flex;align-items:flex-end}
.vm i{background:linear-gradient(0deg,var(--ok) 0 70%,var(--accent) 70% 90%,var(--rec) 90%);transform-origin:bottom;transform:scaleY(0)}
.vfader{writing-mode:vertical-lr;direction:rtl;width:22px;height:100%;accent-color:var(--accent);margin:0;cursor:pointer}
.dbv{font:11px var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums}
.ms{display:flex;gap:4px}

/* ---------- plugin panels (each plugin has its own layout) ---------- */
.dev.fancy{max-width:660px}
.plate{display:flex;align-items:baseline;gap:10px;padding:9px 12px 2px;flex-wrap:wrap}
.plate b{font-size:21px;line-height:1;letter-spacing:.04em;color:var(--fink,var(--fg));text-transform:none;font-weight:700}
.plate span{font:600 10px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--fdim,var(--dim))}
.dev[data-look="spectra"] .plate b{background:linear-gradient(90deg,#d9c8ff,#5ee6ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.12em}
.dev[data-look="boom808"] .plate b{color:#f2a33a;letter-spacing:.02em}
.dev[data-look="ratio"] .plate b{letter-spacing:.06em;font-weight:400}
.dev[data-look="acid"] .plate b{font-style:italic}
.panel{display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:flex-start}
.psec{flex:0 1 auto;min-width:0;max-width:100%;border:1px solid var(--fline,var(--line));border-radius:6px;background:color-mix(in srgb,var(--ctl,var(--sunk)) 38%,transparent);padding:6px 8px 8px}
.psec.full{flex:1 1 100%}
.ptitle{font:700 10px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--arc,var(--accent));padding:0 0 7px}
.pbody{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.prow{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:flex-end}
.pctl{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pctl .klab,.fdr .klab{font:600 10px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--fdim,var(--dim));text-align:center}
.akm{display:none}
/* knob styles + sizes */
.knob.k-lg{width:72px}.knob.k-lg svg{width:54px;height:54px}
.knob.k-xl{width:110px}.knob.k-xl svg{width:92px;height:92px}.knob.k-xl .klab{font-size:12px}.knob.k-xl .kval{font-size:13px}
.knob .ktick{fill:var(--track,var(--sunk))}.knob .ktick.on{fill:var(--arc,var(--accent))}
.knob .kch{fill:var(--ptr,var(--fg))}.knob .kcd{fill:var(--cap,var(--raise-2))}
.knob.k-chicken .kc{fill:var(--cap,var(--raise-2));stroke:color-mix(in srgb,var(--ptr,#fff) 18%,transparent);stroke-width:.8}
.knob .kled{fill:color-mix(in srgb,var(--arc,var(--accent)) 16%,var(--track,var(--sunk)))}
.knob .kled.on{fill:var(--arc,var(--accent));filter:drop-shadow(0 0 1.6px var(--arc,var(--accent)))}
.knob .kdot{fill:var(--arc,var(--accent))}
.knob.k-cap .kc{fill:var(--cap,var(--raise-2));stroke:color-mix(in srgb,#000 35%,transparent);stroke-width:1}
.knob.k-cap .kcs{fill:color-mix(in srgb,#fff 9%,var(--cap,var(--raise-2)))}
.knob .thin{stroke-width:2}
.knob.k-cap .kp{stroke:var(--arc,var(--accent));stroke-width:2.4}
/* switches */
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:5px;background:var(--ctl,var(--sunk));border:1px solid var(--fline,var(--line));max-width:330px}
.segb{min-width:30px;height:26px;padding:0 7px;border-radius:3px;border:1px solid transparent;background:transparent;color:var(--fdim,var(--dim));cursor:pointer;font:600 11px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.segb:hover{color:var(--fink,var(--fg))}
.segb.on{background:var(--arc,var(--accent));color:var(--face-ink,#111);box-shadow:0 0 8px color-mix(in srgb,var(--arc,var(--accent)) 45%,transparent)}
.dev[data-look="acid"] .segb.on,.dev[data-look="ratio"] .segb.on{color:#f1ede3}
.segb svg{width:20px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg-algo .segb{height:44px;min-width:40px;flex-direction:column;gap:2px}
.seg-algo svg{width:20px;height:24px;stroke-width:1.2}.seg-algo svg rect{fill:currentColor;stroke:none;opacity:.85}
.seg-switch{padding:2px}.seg-switch .segb{height:30px;min-width:40px}
/* faders */
.faders{gap:6px 10px}
.fdr{display:flex;flex-direction:column;align-items:center;gap:3px;width:42px;cursor:ns-resize;touch-action:none;user-select:none;border-radius:4px;position:relative}
.fdr-track{position:relative;width:8px;height:92px;border-radius:4px;background:var(--track,var(--sunk));box-shadow:inset 0 1px 2px #0008}
.fdr-fill{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:color-mix(in srgb,var(--arc,var(--accent)) 70%,transparent)}
.fdr-cap{position:absolute;left:50%;width:28px;height:14px;margin-left:-14px;border-radius:3px;background:linear-gradient(180deg,color-mix(in srgb,#fff 22%,var(--cap,#333)),var(--cap,#333));border:1px solid #0007;box-shadow:0 2px 4px #0007}
.fdr-cap::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:2px;background:var(--arc,var(--accent))}
.fdr .kval{font:11px/1.2 var(--f-mono);color:var(--fink,var(--fg));white-space:nowrap}
.fdr.auto::before,.xy.auto::before{content:"";position:absolute;top:0;right:2px;width:7px;height:7px;border-radius:50%;background:var(--rec);z-index:2}
/* XY pad */
.xyw{align-items:stretch}
.xy{position:relative;width:220px;height:124px;border-radius:5px;background:var(--disp,#0005);border:1px solid var(--fline,var(--line));cursor:crosshair;touch-action:none;overflow:hidden;
  background-image:linear-gradient(color-mix(in srgb,var(--fink,#fff) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--fink,#fff) 8%,transparent) 1px,transparent 1px);background-size:25% 25%}
.xy.wide{width:min(560px,100%);height:150px}
.xyw.wide{flex:1 1 auto;min-width:0;width:100%}
.xybg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.xydot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--arc,var(--accent));border:2px solid var(--fink,#fff);box-shadow:0 0 12px var(--arc,var(--accent));pointer-events:none}
.xylabels{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.xyl{font:11px var(--f-mono);color:var(--fdim,var(--dim));cursor:context-menu}
/* ADSR */
.adsrw{align-items:stretch}
.adsr{width:240px;max-width:100%;height:92px;border-radius:5px;background:var(--disp,#0005);border:1px solid var(--fline,var(--line));cursor:grab;touch-action:none}
.adsr .af{fill:var(--arc,var(--accent));opacity:.16}.adsr .al{fill:none;stroke:var(--arc,var(--accent));stroke-width:2;stroke-linejoin:round}
.adsr .ah{fill:var(--face-solid,#111);stroke:var(--fink,#fff);stroke-width:2}.adsr .ah:hover{fill:var(--arc,var(--accent))}
.adsrt{font:10.5px var(--f-mono);color:var(--fdim,var(--dim));text-align:center}
/* EQ */
.eqwrap{flex:1 1 100%;align-items:stretch}
.eqw{position:relative;height:130px;border-radius:5px;background:var(--disp,#0005);border:1px solid var(--fline,var(--line));overflow:hidden}
.eqbg{position:absolute;inset:0;width:100%;height:100%}
.eqn{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 var(--f-display);background:var(--arc,var(--accent));color:#0a1310;border:2px solid var(--fink,#fff);cursor:grab;touch-action:none;box-shadow:0 0 10px color-mix(in srgb,var(--arc,var(--accent)) 60%,transparent)}
/* wavetable display */
.wtw{position:relative;flex:1 1 100%;width:100%;min-width:0;height:120px;border-radius:6px;background:radial-gradient(120% 140% at 50% 0%,#2a1d52 0%,#08070f 70%);border:1px solid var(--fline,var(--line));cursor:ew-resize;touch-action:none;overflow:hidden;box-shadow:inset 0 0 24px #5ee6ff22}
.wtd{position:absolute;inset:0;width:100%;height:100%}
.wth{position:absolute;right:8px;bottom:6px;font:10px var(--f-mono);color:var(--fdim,var(--dim))}
/* drum pads */
.bigpads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bpad{height:58px;border-radius:6px;border:1px solid color-mix(in srgb,var(--pc) 55%,#000);background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 32%,#2a2d33),color-mix(in srgb,var(--pc) 16%,#15171b));color:#f4f6f8;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 11px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;box-shadow:inset 0 -3px 0 #0005,0 2px 4px #0006}
.bpad small{font:10px var(--f-mono);opacity:.6;text-transform:none;letter-spacing:0}
.bpad.hit{animation:padhit .32s ease-out}
@keyframes padhit{0%{background:var(--pc);box-shadow:0 0 22px var(--pc),inset 0 -3px 0 #0003;color:#111}100%{}}
/* keyboard strip */
.keybw{align-items:flex-start;max-width:100%;overflow-x:auto}
.keyb{display:block;border-radius:3px;cursor:pointer}
/* scope, VU, tube */
.scope{width:150px;height:46px;border-radius:4px;background:var(--disp,#0006);border:1px solid var(--fline,var(--line))}
.vu{width:170px;height:95px;border-radius:6px;background:linear-gradient(180deg,#f3e9cf,#e2d3ac);border:2px solid #0006;box-shadow:inset 0 2px 6px #0004}
.vu .vuarc{fill:none;stroke:#3a2a1a;stroke-width:1.2}.vu .vutk{fill:#3a2a1a}.vu .vut{font:8px var(--f-mono);fill:#3a2a1a}
.vu .vun{stroke:#c0281e;stroke-width:1.8;stroke-linecap:round}.vu .vuc{fill:#2a1a10}
.tubew{--g:.3}
.tube{position:relative;width:44px;height:92px;border-radius:22px 22px 8px 8px;background:linear-gradient(90deg,#ffffff10,#ffffff30 40%,#ffffff08);border:1px solid #ffffff30;overflow:hidden}
.tglow{position:absolute;left:4px;right:4px;bottom:6px;top:18px;border-radius:16px;background:radial-gradient(60% 55% at 50% 60%,#ffb347,#ff6a1a 45%,transparent 75%);opacity:var(--g);filter:blur(2px)}
.tfil{position:absolute;left:50%;top:26px;bottom:14px;width:2px;margin-left:-1px;background:#ffd59a;opacity:calc(.3 + var(--g));box-shadow:0 0 8px #ffb347}
@media (prefers-reduced-motion:reduce){.bpad.hit{animation:none}}

/* ---------- Channel Rack ---------- */
.rkbar .seg{max-width:none}
.rkpos{font:600 13px var(--f-mono);color:var(--accent);min-width:7ch;text-align:center}
.rkwrap{flex:1;min-height:0;overflow:auto;padding:8px 10px 14px}
.crack{display:flex;flex-direction:column;gap:3px;width:max-content;min-width:100%}
.rkhead{display:flex;align-items:center;gap:8px;margin-top:8px;padding:4px 6px;border-left:3px solid var(--c);background:var(--raise);border-radius:0 4px 4px 0;position:sticky;left:0;width:max-content}
.rkhead:first-child{margin-top:0}
.rkled{width:12px;height:12px;border-radius:50%;border:1px solid var(--line-2);background:var(--sunk);cursor:pointer;padding:0}
.rkled.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.rkname{background:none;border:0;color:var(--fg);font:700 13px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:2px 0}
.rkname:hover{color:var(--accent)}
.rkinst{font-size:11px;color:var(--dim)}
.rkrow{display:flex;align-items:center;gap:8px}
.rklabel{width:104px;flex:none;position:sticky;left:0;z-index:1;background:var(--panel)}
.rklab{width:100%;height:24px;border-radius:4px;border:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 30%,var(--raise)),var(--raise) 70%);color:var(--fg);text-align:left;padding:0 8px;cursor:pointer;font:600 11px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rknote{width:100%;height:24px;font-size:12px}
.rksteps{display:grid;grid-template-columns:repeat(var(--steps),24px);gap:3px}
.rstep{width:24px;height:24px;border-radius:4px;border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 7%,var(--sunk));cursor:pointer;padding:0;position:relative}
.rstep.alt{background:color-mix(in srgb,var(--rec) 13%,var(--sunk))}
.rstep:hover{border-color:var(--line-2)}
.rstep.on{background:var(--sc,var(--accent));border-color:color-mix(in srgb,var(--sc,var(--accent)) 70%,#000);box-shadow:inset 0 -3px 0 #0004}
.rstep.on.acc{box-shadow:inset 0 3px 0 #fff8,0 0 8px var(--sc,var(--accent))}
.rstep.oth::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--dim);opacity:.6}
.rstep.cur{outline:2px solid var(--fg);outline-offset:1px}
/* sends, returns */
.knob.k-sm{width:40px}.knob.k-sm svg{width:26px;height:26px}.knob.k-sm .kval{font-size:9.5px}.knob.k-sm .klab{font-size:9px;max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .sends{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;width:100%}
.strip.ret{background:color-mix(in srgb,var(--fg) 4%,var(--raise));border-top-style:dashed}
.addret{align-self:flex-start;height:30px;flex:none}
.dev.sendcard .knobs{padding:10px 10px 4px}
.sendbtns{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}
.tog.r.on{background:var(--rec);border-color:var(--rec);color:var(--ink)}
#btnRec.mic{animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--rec) 40%,transparent)}}
/* slicer + timeshift panels */
.slwrap{flex:1 1 100%;align-items:stretch;gap:6px}
.slw{position:relative;height:118px;border-radius:6px;background:var(--disp,#0006);border:1px solid var(--fline,var(--line));overflow:hidden;cursor:pointer}
.slcv{position:absolute;inset:0;width:100%;height:100%}
.slfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.slinfo{font:11px var(--f-mono);color:var(--fdim,var(--dim))}
.slbtns{display:flex;gap:6px}
.slbtns .btn{background:var(--arc,var(--accent));border-color:var(--arc,var(--accent));color:#1c0f08}
.tfwrap{flex:1 1 100%;align-items:stretch}
.tfw{position:relative;height:96px;border-radius:6px;background:var(--disp,#0006);border:1px solid var(--fline,var(--line));overflow:hidden;box-shadow:inset 0 0 22px color-mix(in srgb,var(--arc,#4fe0d0) 18%,transparent)}
.tfcv{position:absolute;inset:0;width:100%;height:100%}
.kselect.wide .sel{min-width:180px}
.uplist{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.uprow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--raise)}
.ib.save{color:var(--accent)}

/* track heights + zoom */
.thead{position:sticky}
.trz{position:absolute;left:0;right:0;bottom:-3px;height:7px;cursor:ns-resize;z-index:3}
.trz:hover{background:linear-gradient(transparent 2px,var(--accent) 2px,var(--accent) 4px,transparent 4px)}
.row.short .trow2,.row.short .tmeter{display:none}
.row.short .tmain{justify-content:center;padding-block:2px}
.hgrp{display:inline-flex;align-items:center;gap:4px}
.zoomgrp{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:4px;padding:1px 2px}
.zoomgrp .ib.fit{width:auto;padding:0 6px;font-size:11px}
.clip.looped .cl::after{content:" ⟳";opacity:.75}
/* Ableton-style editing */
.clip.muted{filter:grayscale(1);opacity:.42}
.clip.muted .cl{background:var(--faint)}
.prgrid.draw{cursor:cell}
.main.nolib{grid-template-columns:minmax(0,1fr)}
.main.nolib #lib{display:none}
.mbody.keys{display:grid;gap:14px;padding-bottom:12px}
.kprefs{display:flex;flex-wrap:wrap;gap:10px 20px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.kprefs label{display:flex;flex-direction:column;gap:5px;min-width:0}
.knote{margin:0;font-size:12px;color:var(--dim)}
.mbody.keys h3{margin:0 0 6px;font:700 13px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.mbody.keys dl{margin:0;display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:5px 14px;align-items:baseline}
.mbody.keys dt{white-space:normal;color:var(--dim);font-size:12px}
.mbody.keys dd{margin:0;font-size:13px;min-width:0}
kbd{display:inline-block;font:600 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;background:var(--sunk);border:1px solid var(--line-2);border-bottom-width:2px;color:var(--fg);white-space:nowrap}
@media (max-width:520px){.mbody.keys dl{grid-template-columns:1fr}.mbody.keys dd{margin-bottom:6px}}

/* automation lanes */
.arow{border-bottom:1px solid var(--line)}
.ahead{background:color-mix(in srgb,var(--c) 7%,var(--panel))!important}
.ahead .trow1,.ahead .trow2{gap:5px}
.ahead .sel{height:22px;font-size:12px;flex:1;min-width:0;padding:0 4px}
.ahead .pw{width:20px;height:20px;flex:none}
.aread{flex:none;max-width:9ch;font:11px var(--f-mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.alane{background-color:color-mix(in srgb,var(--c) 5%,var(--bg));cursor:crosshair;touch-action:none}
.alane.off .asvg{opacity:.4}
.asvg{position:absolute;left:0;top:0;overflow:visible}
.asvg .abase{stroke:var(--faint);stroke-dasharray:3 4;stroke-width:1}
.asvg .aline{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.asvg .afill{fill:var(--c);opacity:.12}
.asvg .apt{fill:var(--bg);stroke:var(--c);stroke-width:2;cursor:grab}
.asvg .apt:hover{fill:var(--c)}
.asvg .ahint{fill:var(--dim);font:12px var(--f-body)}
.tog.a.on{background:var(--rec);border-color:var(--rec);color:var(--ink)}
.tog.a.has:not(.on){color:var(--rec);border-color:color-mix(in srgb,var(--rec) 60%,transparent)}
.knob.auto{position:relative}
.knob.auto::before{content:"";position:absolute;top:2px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 2px var(--face,var(--raise))}
.vfader.auto{accent-color:var(--rec)}

/* floating instrument windows */
#wins{position:fixed;inset:0;z-index:50;pointer-events:none}
.pwin{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:280px;min-height:180px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);background:var(--panel);border:1px solid var(--line-2);border-top:3px solid var(--c);border-radius:8px;box-shadow:0 18px 50px #000a,0 2px 8px #0006;overflow:visible}
.pwin.sel{border-color:color-mix(in srgb,var(--c) 70%,var(--line-2));border-top-color:var(--c)}
.pwin.drag{opacity:.93;box-shadow:0 26px 70px #000c}
.pwin.flash{animation:pwflash .45s ease}
@keyframes pwflash{0%{box-shadow:0 0 0 3px var(--c),0 18px 50px #000a}100%{box-shadow:0 18px 50px #000a,0 2px 8px #0006}}
.pwh{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;background:var(--raise);border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none;flex:none}
.pwin.drag .pwh{cursor:grabbing}
.pwdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.pwt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.pwt b{font:700 15px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.pwt span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwh .ib{width:26px;height:26px;font-size:15px}
.pwb{flex:1;min-height:0;overflow:auto;background:var(--bg)}
.rack.wrap{flex-wrap:wrap;width:auto;min-width:0}
.rack.wrap .dev{max-width:100%}
.dev.popout{display:flex;flex-direction:column;gap:6px;padding:10px;min-width:150px;max-width:170px;background:transparent;border-style:dashed}
.dev.popout .btn{justify-content:center}
.dev.popout .note{padding:0}
.ib.open{color:var(--dim)}
.ib.open.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
@media (prefers-reduced-motion:reduce){.pwin.flash{animation:none}}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:100;background:#05060899;display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;width:min(640px,100%);max-height:90%;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a}
.mbox h2{margin:0;padding:14px 16px 10px;font:700 20px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.mbody{padding:0 16px;overflow:auto;font-size:14px;line-height:1.55;color:var(--fg)}
.mbody p{margin:0 0 10px;max-width:62ch}
.mbody code{font:12px var(--f-mono);background:var(--sunk);padding:1px 4px;border-radius:3px}
.mbody pre{font:12px/1.5 var(--f-mono);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:10px;overflow:auto;margin:0 0 10px;white-space:pre}
.mbody ul{margin:0 0 10px;padding-left:18px}
.mact{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:5px;font-weight:500;font-size:13px;max-width:min(520px,calc(100vw - 32px));box-shadow:0 8px 30px #0008}
#busy{position:fixed;inset:0;z-index:110;background:#0507098c;display:grid;place-items:center;font:600 16px var(--f-display);letter-spacing:.08em;text-transform:uppercase}

@media (max-width:760px), (max-height:500px) and (pointer:coarse){
  :root{--hw:126px;--rowh:58px;--dock-h:250px}
  .main{grid-template-columns:minmax(0,1fr)}
  #lib{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(300px,86vw);border-radius:0 6px 6px 0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 40px #000c}
  #lib.open{transform:none}
  #btnLib,#libClose{display:inline-flex}
  .hide-s{display:none!important}
  .brand input{width:110px}
  .tname{font-size:13px}
  .trow2 .chip{display:none}
}
@media (prefers-reduced-motion:reduce){#lib{transition:none}}

/* menus */
.cmenu{position:fixed;z-index:200;min-width:210px;max-width:300px;max-height:calc(100vh - 16px);overflow:auto;background:var(--raise);border:1px solid var(--line-2);border-radius:6px;padding:4px;box-shadow:0 12px 36px #000a;font-size:13px}
.cmenu .mi{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px 5px 4px;background:none;border:0;border-radius:4px;text-align:left;cursor:pointer;color:var(--fg)}
.cmenu .mi:hover,.cmenu .mi:focus-visible{background:var(--accent);color:var(--accent-ink);outline:none}
.cmenu .mi:hover kbd,.cmenu .mi:focus-visible kbd{color:inherit;opacity:.75}
.cmenu .mi[disabled]{opacity:.4;cursor:default;background:none;color:var(--fg)}
.cmenu .mi.danger{color:var(--rec)}.cmenu .mi.danger:hover,.cmenu .mi.danger:focus-visible{background:var(--rec);color:#fff}
.cmenu .mck{width:14px;flex:none;text-align:center;font-size:12px}
.cmenu .ml{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmenu kbd{font:11px var(--f-mono);color:var(--faint);background:none;border:0;padding:0}
.cmenu .msep{height:1px;background:var(--line);margin:4px 2px}
.cmenu .mhead{padding:5px 8px 3px 22px;font:600 11px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmenu .mswatch{display:flex;gap:5px;padding:5px 8px 5px 22px}
.cmenu .sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;background:var(--sw);cursor:pointer;padding:0}
.cmenu .sw.on{border-color:var(--fg)}.cmenu .sw:hover,.cmenu .sw:focus-visible{transform:scale(1.15);outline:none;border-color:var(--fg)}
.menubtn span{font-size:10px;opacity:.7;margin-left:2px}
/* track delete only on hover */
.thead .tdel{opacity:0;transition:opacity .12s}
.row:hover .thead .tdel,.thead .tdel:focus-visible{opacity:1}
@media (hover:none){.thead .tdel{opacity:1}}
.addrow .addhint{align-items:center;padding:0 12px;color:var(--faint);font-size:12px}
/* window tabs */
.wtabs{position:sticky;top:0;z-index:3;display:flex;gap:2px;padding:6px 8px 0;background:var(--panel);border-bottom:1px solid var(--line)}
.wtab{background:none;border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;padding:6px 14px;cursor:pointer;color:var(--dim);font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin-bottom:-1px}
.wtab:hover{color:var(--fg)}
.wtab.on{background:var(--bg);color:var(--fg);border-color:var(--line);box-shadow:inset 0 2px 0 var(--c,var(--accent))}
.wtab em{font-style:normal;margin-left:6px;font:600 10px/1 var(--f-mono);background:var(--raise-2);color:var(--fg);padding:2px 5px;border-radius:8px}

/* ================= plugin hardware forms ================= */
.dev[data-form]{position:relative}
/* 19" rack units: metal ears with screw slots */
.dev[data-form="rack"],.dev[data-form="rackunit"]{padding-inline:22px;border-radius:3px;background-image:repeating-linear-gradient(90deg,#ffffff05 0 1px,transparent 1px 3px),var(--face);box-shadow:inset 0 1px 0 #ffffff14,0 6px 18px #0006}
.dev .ear{position:absolute;top:0;bottom:0;width:18px;background:linear-gradient(90deg,#8d939c,#c9ced6 45%,#6f757e);border-inline:1px solid #0008;box-shadow:inset 0 1px 0 #fff6}
.dev .ear.l{left:0;border-left:0}.dev .ear.r{right:0;border-right:0}
.dev .ear::before,.dev .ear::after{content:"";position:absolute;left:4px;width:10px;height:6px;border-radius:3px;background:#06070a;box-shadow:inset 0 1px 2px #000,0 1px 0 #ffffff18}
.dev .ear::before{top:12px}.dev .ear::after{bottom:12px}
.dev[data-form="rack"] .devh{border-radius:0}
.dev[data-form="rack"] .psec,.dev[data-form="rackunit"] .psec{border-radius:3px}
/* screws */
.dev .screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f4f4,#8b8f96 55%,#4a4d53);box-shadow:0 1px 1px #0008;z-index:2;pointer-events:none}
.dev .screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1.2px;background:#3a3c41;transform:rotate(35deg)}
.dev .screw.tl{top:5px;left:5px}.dev .screw.tr{top:5px;right:5px}.dev .screw.bl{bottom:5px;left:5px}.dev .screw.br{bottom:5px;right:5px}
.dev[data-form="module"] .screw.tl,.dev[data-form="module"] .screw.tr,.dev[data-form="tape"] .screw.tl,.dev[data-form="tape"] .screw.tr{top:auto;bottom:5px}
/* stompbox pedals */
.dev[data-form="pedal"]{width:300px;max-width:100%;border-radius:18px;border:2px solid #0008;padding-bottom:6px;
  background-image:radial-gradient(circle at 20% 30%,#ffffff10 0 1px,transparent 2px),radial-gradient(circle at 70% 60%,#00000022 0 1px,transparent 2px),radial-gradient(circle at 45% 80%,#ffffff0c 0 1px,transparent 2px),var(--face);
  background-size:7px 7px,9px 9px,11px 11px,auto;box-shadow:inset 0 2px 0 #ffffff1c,inset 0 -3px 0 #0005,0 10px 24px #0008}
.dev[data-form="pedal"] .devh{background:transparent;border-bottom:0}
.dev[data-form="pedal"] .presetrow{padding-inline:14px}
.dev[data-form="pedal"] .psec{border:0;background:none;padding:4px 6px}
.dev[data-form="pedal"] .psec .prow{justify-content:center;width:100%}
.dev[data-form="pedal"] .pbody{justify-content:center}
.dev[data-form="pedal"] .xyw{height:90px}
.stompw{gap:6px;width:100%;padding:4px 0 6px}
.stompw .pled{width:12px;height:12px;border-radius:50%;background:#3a0b0b;box-shadow:inset 0 1px 2px #000;transition:background .15s,box-shadow .15s}
.stompw .pled.on{background:#ff3b30;box-shadow:0 0 10px #ff3b30,0 0 3px #ff8a80,inset 0 -1px 2px #0006}
.stompw .pname{font-size:28px;line-height:1;color:var(--fink);letter-spacing:.04em;text-shadow:0 2px 0 #0006}
.stompw .ptag{font:600 9px/1 var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--fdim)}
.stomp{width:58px;height:58px;border-radius:50%;margin-top:6px;cursor:pointer;border:3px solid #2a2c30;
  background:radial-gradient(circle at 38% 32%,#fafafa,#b9bcc2 30%,#6c7078 62%,#3a3d43);box-shadow:0 5px 0 #15161a,0 7px 14px #000a,inset 0 -3px 6px #0005;transition:transform .06s,box-shadow .06s}
.stomp:active{transform:translateY(3px);box-shadow:0 2px 0 #15161a,0 3px 8px #000a,inset 0 -2px 4px #0005}
.dev.off[data-form="pedal"]{filter:saturate(.55) brightness(.85)}
/* eurorack module */
.dev[data-form="module"]{width:250px;max-width:100%;border-radius:2px;padding:0 0 18px;background-image:linear-gradient(90deg,#ffffff08,transparent 30%,transparent 70%,#00000018),var(--face);box-shadow:inset 1px 0 0 #ffffff14,inset -1px 0 0 #0006,0 6px 16px #0007}
.dev[data-form="module"] .xyw{height:150px}
.jacks{display:flex;justify-content:space-around;width:100%;padding:4px 0 0}
.jack{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 9px/1 var(--f-display);letter-spacing:.14em;color:var(--fdim)}
.jack i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#050505 0 4px,#9ea3aa 4.5px 6px,#5d6168 6.5px 8px,#2b2d31 8.5px);box-shadow:0 1px 2px #000a}
/* tape echo */
.dev[data-form="tape"]{padding-bottom:16px;border-radius:8px;box-shadow:inset 0 1px 0 #ffffff12,0 8px 22px #0008}
.reelsw{width:100%}
.reels{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.reels .rfl{fill:#0d1726;stroke:#5c6f8c;stroke-width:1.5}
.reels .rtape{fill:#3a2a1c;stroke:#5a412b;stroke-width:1}
.reels .rwin{fill:#0d1726;stroke:#7d8fa8;stroke-width:.8}
.reels .rhub{fill:#c9d4e3;stroke:#3a4658}.reels .rpin{fill:#3a4658}
.reels .rpath{fill:none;stroke:#5a412b;stroke-width:2.5}
.reels .head{fill:#b9c3cf;stroke:#2b3442}.reels .head.rec{fill:#ff6b5e}
/* drum machines: 808 / 303 step rows */
.stepsw{width:100%}
.steps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;width:100%}
.steps .st{display:flex;flex-direction:column;align-items:center;gap:3px;height:38px;justify-content:flex-end;border-radius:3px;padding-bottom:3px;background:var(--sc);box-shadow:inset 0 -3px 0 #0003,0 1px 2px #0006}
.steps .st small{font:600 8px/1 var(--f-mono);color:#0009}
.steps .led{width:7px;height:7px;border-radius:50%;background:#3b0c08;box-shadow:inset 0 1px 1px #000a}
.steps .st.cur .led{background:#ff4a3a;box-shadow:0 0 6px #ff4a3a}
.steps .st.hit{animation:stephit .28s ease-out}
@keyframes stephit{0%{filter:brightness(calc(1 + var(--hv,.8)))}100%{filter:none}}
.steps-tr .g0{--sc:#e8541e}.steps-tr .g1{--sc:#f2a33a}.steps-tr .g2{--sc:#f1d36b}.steps-tr .g3{--sc:#f1e9d2}
.steps-303 .st{--sc:linear-gradient(180deg,#f2f3f5,#c4c8ce);height:30px}
.steps-303 .st:nth-child(4n+1) small{color:#c0281c}
/* playable mini keyboard */
.psec.keysec{padding:6px}
.mkeysw{width:100%}
.mkeys{position:relative;display:flex;width:100%;height:64px;--bw:calc(100% / var(--nw) * .62);touch-action:none;user-select:none;-webkit-user-select:none}
.mk{flex:1 1 0;min-width:0;border:1px solid #0007;border-top:0;border-radius:0 0 4px 4px;background:linear-gradient(180deg,#e9e6dd,#fffdf7 70%,#dcd8cc);cursor:pointer;padding:0;display:flex;align-items:flex-end;justify-content:center;box-shadow:inset 0 -3px 0 #0002}
.mk small{font:9px var(--f-mono);color:#0008;padding-bottom:4px}
.mk.bk{position:absolute;top:0;height:60%;width:var(--bw);transform:translateX(-50%);z-index:1;background:linear-gradient(180deg,#25262a,#0c0c0e);border:1px solid #000;box-shadow:inset 0 -3px 0 #ffffff14,0 2px 3px #0008}
.mk.lit{background:var(--arc)!important;box-shadow:inset 0 0 0 1px #0005,0 0 10px var(--arc)}
.mk.on{background:color-mix(in srgb,var(--arc) 70%,#fff)!important;transform:translateY(1px)}
.mk.bk.on{transform:translateX(-50%) translateY(1px)}
/* per-instrument finishes */
.dev[data-form="desk"] .psec{background:linear-gradient(180deg,#0f0e0d,#1a1817);border-color:#3a332c}
.dev[data-form="desk"] .plate b{font-size:26px;color:#e8b04a;text-shadow:0 1px 0 #000}
.dev[data-form="desk"] .keysec{background:#0b0a09}
.dev[data-form="box303"]{background-image:repeating-linear-gradient(180deg,#ffffff1a 0 1px,transparent 1px 3px),var(--face);padding-bottom:12px}
.dev[data-form="box303"] .plate b{font-size:24px;letter-spacing:.02em}
.dev[data-form="box303"] .psec{background:#ffffff26;border-color:#7c828c}
.dev[data-form="tr"] .psec{background:#2a2a2f;border-color:#55555d}
.dev[data-form="tr"] .plate b{font-size:26px;font-style:italic}
.dev[data-form="dx"]{border-radius:3px;padding-bottom:12px}
.dev[data-form="dx"] .seg-algo .segb{border-radius:2px;background:linear-gradient(180deg,#d65b3f,#b2402a);color:#fff3ea;box-shadow:inset 0 -2px 0 #0003}
.dev[data-form="dx"] .seg-algo .segb.on{background:linear-gradient(180deg,#4d9b5d,#2f7a40)}
.dev[data-form="dx"] .lcd2{font-size:13px;letter-spacing:.06em;background:linear-gradient(180deg,#a9c08d,#93ad78);border:3px solid #26231d}
.dev[data-form="mpc"] .bigpads{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:6px;background:#111214;border-radius:6px;box-shadow:inset 0 2px 6px #000}
.dev[data-form="mpc"] .bpad{height:64px;border-radius:9px;border:1px solid #000;background:radial-gradient(120% 90% at 50% 15%,#4a4d53,#2a2c30);box-shadow:inset 0 2px 0 #ffffff14,inset 0 -3px 0 #0006,0 0 0 1px color-mix(in srgb,var(--pc) 35%,transparent);color:#d9dce1}
.dev[data-form="mpc"] .bpad.hit{animation:mpchit .35s ease-out}
@keyframes mpchit{0%{background:radial-gradient(120% 90% at 50% 15%,var(--pc),color-mix(in srgb,var(--pc) 40%,#000));box-shadow:0 0 18px var(--pc)}100%{}}
.dev[data-form="screen"] .wtw{height:170px}
.eqspec{pointer-events:none}
@media (prefers-reduced-motion:reduce){.steps .st.hit,.dev[data-form="mpc"] .bpad.hit{animation:none}}

/* computer keyboard toggle + key map */
#kbstrip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:90;width:min(620px,calc(100vw - 32px));background:var(--raise);border:1px solid var(--accent);border-radius:8px;box-shadow:0 12px 36px #000a;padding:8px 10px 10px}
.kbhead{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:8px;font-size:12px}
.kbon{display:flex;align-items:center;gap:6px;font:700 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.kbon i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.kbto{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.kbto.warn{color:var(--rec)}
.kbstep{display:flex;align-items:center;gap:3px}
.kbstep b{font:600 12px var(--f-mono);min-width:30px;text-align:center}
.kbstep kbd{font:10px var(--f-mono);color:var(--faint);margin-left:2px}
.kboff{height:24px;padding:0 8px;font-size:12px}
.kbkeys{position:relative;display:flex;height:74px;user-select:none}
.kk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding-bottom:6px;border-radius:0 0 5px 5px}
.kk b{font:700 14px/1 var(--f-mono)}
.kk small{font:10px/1 var(--f-mono);opacity:.7;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.kk.w{flex:1 1 0;min-width:0;background:linear-gradient(180deg,#e9e6dd,#fffdf7 70%,#dcd8cc);color:#1b1c20;border:1px solid #0007;border-top:0;box-shadow:inset 0 -3px 0 #0002}
.kk.b{position:absolute;top:0;height:58%;width:calc(100% / 10 * .64);transform:translateX(-50%);z-index:1;background:linear-gradient(180deg,#2a2b30,#0c0c0e);color:#eceae4;border:1px solid #000;padding-bottom:4px}
.kk.b b{font-size:12px}.kk.b small{font-size:9px}
.kk.on{background:var(--accent)!important;color:var(--accent-ink)!important;box-shadow:0 0 12px var(--accent)}
@media (max-width:640px){.kbstep kbd,.kbto{display:none}}

/* window resize handles + plugin zoom */
.pwb{zoom:var(--wz,1);border-radius:0 0 8px 8px}
.pwh{border-radius:5px 5px 0 0}
.wrz{position:absolute;z-index:5;touch-action:none}
.wrz.n,.wrz.s{left:10px;right:10px;height:8px;cursor:ns-resize}.wrz.n{top:-5px}.wrz.s{bottom:-5px}
.wrz.e,.wrz.w{top:10px;bottom:10px;width:8px;cursor:ew-resize}.wrz.e{right:-5px}.wrz.w{left:-5px}
.wrz.ne,.wrz.nw,.wrz.se,.wrz.sw{width:16px;height:16px}

#ruler .marker span{display:block;margin-left:0;padding:2px 7px 2px 6px;background:var(--cue);color:#0b1220;font:700 10px/1.3 var(--f-display);letter-spacing:.08em;text-transform:uppercase;border-radius:0 3px 3px 0;white-space:nowrap;box-shadow:0 1px 3px #0007;border-left:2px solid #0b1220}
#ruler .marker:hover span{filter:brightness(1.12)}
/* projects dialog */
.projs .projlist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;margin-top:8px}
.projrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.projrow.cur{border-color:var(--accent)}
.projrow .pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.projrow .pinfo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.projrow .pinfo span{font-size:12px;color:var(--dim)}
.projrow .pcur{font:600 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.btn.danger{background:var(--rec);border-color:var(--rec);color:#fff}
@media (max-width:760px), (max-height:500px) and (pointer:coarse){
  .padbtn span{display:none}.padbtn{height:34px;padding:0 9px}
  .ppkeys{height:110px}.pppad{height:52px}
  .pbwrap{padding:0;place-items:end stretch}.pbox{width:100%;max-height:85vh;border-radius:14px 14px 0 0}
  .pbi{padding:10px 8px}
}
@media (max-height:500px) and (pointer:coarse){.ppkeys{height:84px}.pppad{height:40px}}

/* Drum Rack pads with their own sounds */
.padsw{width:100%;align-items:stretch;gap:8px}
.bigpads .bpad .pl{font:600 11px/1.15 var(--f-display);letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.bigpads .bpad small{font-size:9px}
.bigpads .bpad.sel{outline:2px solid var(--fink,var(--fg));outline-offset:1px}
.bigpads .bpad.over{outline:2px dashed var(--arc,var(--accent));outline-offset:1px}
.padedit{border:1px solid var(--fline,var(--line));border-radius:6px;padding:6px 8px;background:color-mix(in srgb,var(--ctl,var(--sunk)) 50%,transparent)}
.padhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}.padhead b{font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--arc,var(--accent))}.padhead span{font:11px var(--f-mono);color:var(--fdim,var(--dim))}
.padhead .sel{height:28px;max-width:200px}
.padtip{margin:0 0 0 8px;align-self:center;max-width:220px}

/* velocity lane */
.prvel{flex:none;height:72px;display:flex;border-top:1px solid var(--line-2);background:var(--sunk)}
.prvellab{flex:none;width:64px;display:flex;align-items:flex-start;padding:6px;border-right:1px solid var(--line-2)}
.prvellab span{font:600 10px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.prvelcv{flex:1;min-width:0;height:100%;display:block;cursor:ns-resize;touch-action:none}
@media (max-width:760px), (max-height:500px) and (pointer:coarse){.prvel{height:58px}}

/* track volume sliders */
.volbar{position:relative;flex:1;min-width:0;height:18px;background:var(--sunk);border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:ew-resize;touch-action:none}
.volbar i{position:absolute;inset:0;display:block;background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 55%,transparent) 0 70%,color-mix(in srgb,var(--accent) 70%,transparent) 70% 90%,var(--rec) 90%);transform-origin:left;transform:scaleX(0);opacity:.55}
.volbar .vthumb{position:absolute;top:-1px;bottom:-1px;width:4px;margin-left:-2px;background:var(--fg);border-radius:1px;box-shadow:0 0 0 1px #0008}
.volbar .vlab.l{right:auto;left:5px}
.volbar .vlab{position:absolute;right:4px;top:0;bottom:0;display:flex;align-items:center;font:600 9px/1 var(--f-mono);color:var(--fg);text-shadow:0 1px 2px #000;pointer-events:none}
.volbar:hover,.volbar.drag,.volbar:focus-visible{border-color:var(--line-2)}.volbar.drag .vthumb{background:var(--accent)}
.volbar.auto .vthumb{background:var(--rec)}

.shead .volbar{height:14px;flex:none;margin-top:3px}
@media (pointer:coarse){.volbar{height:20px}.volbar .vthumb{width:6px;margin-left:-3px}}

<script>
'use strict';
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=()=>Math.random().toString(36).slice(2,10);
const mtof=n=>440*Math.pow(2,(n-69)/12);
const NN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const noteName=n=>NN[((n%12)+12)%12]+(Math.floor(n/12)-1);
const dbToGain=db=>db<=-60?0:Math.pow(10,db/20);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.hidden=true,2800)}
const isTyping=e=>{const t=e.target;return t&&(t.tagName==='INPUT'&&!['range','checkbox','button'].includes(t.type)||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)};
function hold(param,t){try{if(param.cancelAndHoldAtTime)param.cancelAndHoldAtTime(t);else param.cancelScheduledValues(t)}catch(e){}}
function sp(ctx,param,v){try{if(ctx.state==='running'&&!(ctx instanceof OfflineAudioContext)){param.cancelScheduledValues(ctx.currentTime);param.setTargetAtTime(v,ctx.currentTime,.012)}else param.value=v}catch(e){try{param.value=v}catch(_){}}}

/* ================= audio context ================= */
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC({latencyHint:'interactive'});
const HOST={get bpm(){return S.bpm}};

/* ================= sample library (synthesized on load) ================= */
const SR=44100,TAU=Math.PI*2;
const SAMPLES=new Map();
const noise=()=>Math.random()*2-1;
function biquad(type,f,q){const w=TAU*f/SR,cs=Math.cos(w),sn=Math.sin(w),a=sn/(2*q);let b0,b1,b2;if(type==='lp'){b0=(1-cs)/2;b1=1-cs;b2=(1-cs)/2}else if(type==='hp'){b0=(1+cs)/2;b1=-(1+cs);b2=(1+cs)/2}else{b0=a;b1=0;b2=-a}const a0=1+a,a1=-2*cs,a2=1-a;let x1=0,x2=0,y1=0,y2=0;return x=>{const y=(b0*x+b1*x1+b2*x2-a1*y1-a2*y2)/a0;x2=x1;x1=x;y2=y1;y1=y;return y}}
function bufFrom(chs){const b=new AudioBuffer({length:chs[0].length,numberOfChannels:chs.length,sampleRate:SR});chs.forEach((d,i)=>b.copyToChannel(d,i));return b}
function normalize(chs,peak=.9){let m=0;for(const d of chs)for(let i=0;i<d.length;i++){const a=Math.abs(d[i]);if(a>m)m=a}if(m>0){const k=peak/m;for(const d of chs)for(let i=0;i<d.length;i++)d[i]*=k}return chs}
function gen(dur,fn){const n=Math.floor(dur*SR),d=new Float32Array(n);for(let i=0;i<n;i++)d[i]=fn(i/SR,i);const f=Math.min(n,220);for(let i=0;i<f;i++)d[n-1-i]*=i/f;return bufFrom(normalize([d]))}
function metal(){const fr=[205.3,304.4,369.6,522.7,540,800],ph=fr.map(()=>Math.random());return()=>{let s=0;for(let k=0;k<6;k++){ph[k]=(ph[k]+fr[k]*1.7/SR)%1;s+=ph[k]<.5?1:-1}return s/6}}
function buildLibrary(){
  const add=(id,name,cat,buffer)=>SAMPLES.set(id,{id,name,cat,buffer,builtin:true});
  {let ph=0;add('kick','Kick','Drums',gen(.6,t=>{const f=46+120*Math.exp(-t*30);ph+=TAU*f/SR;return Math.tanh(1.8*Math.sin(ph)*Math.exp(-t*5.5))+(t<.004?noise()*.35*(1-t/.004):0)}))}
  {const hp=biquad('hp',1500,.8);let ph=0;add('snare','Snare','Drums',gen(.35,t=>{ph+=TAU*(190-30*Math.min(1,t*20))/SR;return hp(noise())*Math.exp(-t*13)*.9+Math.sin(ph)*Math.exp(-t*22)*.7}))}
  {const bp=biquad('bp',1150,1.4);add('clap','Clap','Drums',gen(.4,t=>{let e=0;for(const k of[0,.011,.023])if(t>=k)e=Math.max(e,Math.exp(-(t-k)*170));if(t>.031)e=Math.max(e,.75*Math.exp(-(t-.031)*16));return bp(noise())*e}))}
  {const m=metal(),hp=biquad('hp',7200,.7);add('chh','Closed Hat','Drums',gen(.14,t=>hp(m()*.7+noise()*.5)*Math.exp(-t*55)))}
  {const m=metal(),hp=biquad('hp',6800,.7);add('ohh','Open Hat','Drums',gen(.6,t=>hp(m()*.7+noise()*.5)*Math.exp(-t*7)))}
  {const bp=biquad('bp',1750,5);let ph=0;add('rim','Rim','Drums',gen(.09,t=>{ph+=TAU*1750/SR;return(bp(noise())*.6+Math.sin(ph)*.5)*Math.exp(-t*85)}))}
  {let ph=0;add('toml','Tom Low','Drums',gen(.55,t=>{ph+=TAU*(100+60*Math.exp(-t*12))/SR;return Math.sin(ph)*Math.exp(-t*7)+(t<.003?noise()*.3:0)}))}
  {let ph=0;add('tomh','Tom High','Drums',gen(.45,t=>{ph+=TAU*(165+80*Math.exp(-t*12))/SR;return Math.sin(ph)*Math.exp(-t*8)+(t<.003?noise()*.3:0)}))}
  {const m=metal(),hp=biquad('hp',4200,.6);add('crash','Crash','Drums',gen(2.2,t=>hp(m()*.5+noise()*.7)*Math.exp(-t*2.1)*(t<.002?t/.002:1)))}
  {let a=0,b=0;const bp=biquad('bp',820,1.5);add('cowbell','Cowbell','Drums',gen(.45,t=>{a=(a+545/SR)%1;b=(b+815/SR)%1;return bp((a<.5?1:-1)+(b<.5?1:-1))*(Math.exp(-t*9)*.8+Math.exp(-t*40)*.6)}))}
  {const f=130.81,N=Math.round(SR/f),ring=new Float32Array(N).map(()=>noise());let i0=0;add('pluck','Pluck C3','Instruments',gen(1.6,()=>{const a=ring[i0],b=ring[(i0+1)%N];ring[i0]=(a+b)*.4985;i0=(i0+1)%N;return a}))}
  {let ph=0;add('sub','Sub Bass C2','Instruments',gen(1.2,t=>{ph+=TAU*65.41/SR;return Math.tanh(2.2*Math.sin(ph))*Math.min(1,t/.005)*Math.exp(-t*2.2)}))}
  {const fr=[261.63,311.13,392,523.25],ph=fr.flatMap(()=>[Math.random(),Math.random()]),lp=biquad('lp',2600,.9);add('stab','Chord Stab Cm','Instruments',gen(.9,t=>{let s=0;fr.forEach((f,k)=>{ph[2*k]=(ph[2*k]+f*1.004/SR)%1;ph[2*k+1]=(ph[2*k+1]+f*.996/SR)%1;s+=ph[2*k]+ph[2*k+1]-1});return lp(s/4)*Math.min(1,t/.003)*Math.exp(-t*4.5)}))}
  {const dur=4,n=dur*SR,L=new Float32Array(n),R=new Float32Array(n),fr=[130.81,196,261.63,311.13],lpL=biquad('lp',1100,.7),lpR=biquad('lp',1100,.7),pl=fr.map(()=>Math.random()),pr=fr.map(()=>Math.random());
   for(let i=0;i<n;i++){const t=i/SR;let a=0,b=0;for(let k=0;k<4;k++){pl[k]=(pl[k]+fr[k]*1.006/SR)%1;pr[k]=(pr[k]+fr[k]*.994/SR)%1;a+=2*pl[k]-1;b+=2*pr[k]-1}const env=Math.min(1,t/.8)*Math.min(1,(dur-t)/1.2);L[i]=lpL(a)*env;R[i]=lpR(b)*env}

function dryWet(ctx){const input=ctx.createGain(),output=ctx.createGain(),dry=ctx.createGain(),wet=ctx.createGain();input.connect(dry);dry.connect(output);wet.connect(output);return{input,output,dry,wet,mix(m){sp(ctx,dry.gain,Math.cos(m*Math.PI/2));sp(ctx,wet.gain,Math.sin(m*Math.PI/2))}}}

defp({id:'eq3',name:'EQ Three',kind:'fx',desc:'Low shelf, sweepable mid, high shelf.',
  params:[P('low','Low',-18,18,0,{unit:'dB'}),P('mid','Mid',-18,18,0,{unit:'dB'}),P('midf','Mid freq',150,8000,1000,{unit:'Hz',curve:'exp'}),P('high','High',-18,18,0,{unit:'dB'})],
  create(ctx,v){const lo=ctx.createBiquadFilter(),mid=ctx.createBiquadFilter(),hi=ctx.createBiquadFilter();lo.type='lowshelf';lo.frequency.value=220;mid.type='peaking';mid.Q.value=.9;hi.type='highshelf';hi.frequency.value=4500;lo.connect(mid);mid.connect(hi);
    const set=(id,x)=>{if(id==='low')sp(ctx,lo.gain,x);if(id==='mid')sp(ctx,mid.gain,x);if(id==='midf')sp(ctx,mid.frequency,x);if(id==='high')sp(ctx,hi.gain,x)};for(const k in v)set(k,v[k]);return{input:lo,output:hi,set}}});

  create(ctx,v){const f=ctx.createBiquadFilter();const set=(id,x)=>{if(id==='type')f.type=x;if(id==='freq')sp(ctx,f.frequency,x);if(id==='q')sp(ctx,f.Q,x)};for(const k in v)set(k,v[k]);return{input:f,output:f,set}}});

defp({id:'comp',name:'Compressor',kind:'fx',desc:'Evens out dynamics; makeup gain restores level.',
  params:[P('threshold','Threshold',-60,0,-20,{unit:'dB'}),P('ratio','Ratio',1,20,4,{unit:':1'}),P('attack','Attack',.001,.3,.01,{unit:'s',curve:'exp'}),P('release','Release',.02,1,.2,{unit:'s',curve:'exp'}),P('makeup','Makeup',0,24,3,{unit:'dB'})],
  create(ctx,v){const c=ctx.createDynamicsCompressor(),g=ctx.createGain();c.knee.value=6;c.connect(g);const set=(id,x)=>{if(id==='makeup')sp(ctx,g.gain,dbToGain(x));else if(c[id])sp(ctx,c[id],x)};for(const k in v)set(k,v[k]);return{input:c,output:g,set}}});

defp({id:'drive',name:'Drive',kind:'fx',desc:'Soft saturation with a tone control.',
  params:[P('drive','Drive',0,1,.4),P('tone','Tone',500,16000,6000,{unit:'Hz',curve:'exp'}),P('mix','Mix',0,1,1),P('out','Output',-18,6,-3,{unit:'dB'})],
  create(ctx,v){const dw=dryWet(ctx),sh=ctx.createWaveShaper(),lp=ctx.createBiquadFilter(),o=ctx.createGain();lp.type='lowpass';sh.oversample='2x';dw.input.connect(sh);sh.connect(lp);lp.connect(dw.wet);dw.output.connect(o);
    const curve=d=>{const k=1+d*40,n=2048,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}return c};
    const set=(id,x)=>{if(id==='drive')sh.curve=curve(x);if(id==='tone')sp(ctx,lp.frequency,x);if(id==='mix')dw.mix(x);if(id==='out')sp(ctx,o.gain,dbToGain(x))};for(const k in v)set(k,v[k]);return{input:dw.input,output:o,set}}});

function makeIR(ctx,sec){const r=ctx.sampleRate,n=Math.max(1,Math.floor(sec*r)),b=ctx.createBuffer(2,n,r);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++){d[i]=noise()*Math.pow(1-i/n,2.4)*(i<r*.004?i/(r*.004):1)}}return b}

  params:[P('size','Decay',.3,8,2.2,{unit:'s',curve:'exp'}),P('pre','Pre-delay',0,.15,.02,{unit:'s'}),P('tone','Tone',1000,16000,7000,{unit:'Hz',curve:'exp'}),P('mix','Mix',0,1,.3)],
  create(ctx,v){const dw=dryWet(ctx),pre=ctx.createDelay(1),cv=ctx.createConvolver(),lp=ctx.createBiquadFilter();lp.type='lowpass';dw.input.connect(pre);pre.connect(cv);cv.connect(lp);lp.connect(dw.wet);

    const set=(id,x)=>{v[id]=x;if(id==='size'){if(ctx instanceof OfflineAudioContext||!cv.buffer)ir();else{clearTimeout(tm);tm=setTimeout(ir,150)}}if(id==='pre')sp(ctx,pre.delayTime,x);if(id==='tone')sp(ctx,lp.frequency,x);if(id==='mix')dw.mix(x)};for(const k in v)set(k,v[k]);
    return{input:dw.input,output:dw.output,set}}});
