  'Harmonic minor':[0,2,3,5,7,8,11],'Melodic minor':[0,2,3,5,7,9,11],'Major pentatonic':[0,2,4,7,9],'Minor pentatonic':[0,3,5,7,10],'Blues':[0,3,5,6,7,10]};
const CHORDS={'Off':null,'Triad (in key)':{deg:[0,2,4]},'7th (in key)':{deg:[0,2,4,6]},'9th (in key)':{deg:[0,2,4,6,8]},'Major':{iv:[0,4,7]},'Minor':{iv:[0,3,7]},'Maj7':{iv:[0,4,7,11]},'Min7':{iv:[0,3,7,10]},'Dom7':{iv:[0,4,7,10]},
  'Sus2':{iv:[0,2,7]},'Sus4':{iv:[0,5,7]},'Power (5th + octave)':{iv:[0,7,12]},'Octave':{iv:[0,12]}};
const scaleOn=()=>S.scale&&SCALES[S.scale.mode];
function inScale(p){const sc=scaleOn();if(!sc)return true;return sc.includes(((p-S.scale.root)%12+12)%12)}
const isRoot=p=>scaleOn()&&((p-S.scale.root)%12+12)%12===0;
function snapToScale(p){if(inScale(p))return p;for(let d=1;d<12;d++){if(inScale(p-d))return p-d;if(inScale(p+d))return p+d}return p}
/* pitches for a chord stamped on `p` (diatonic chords follow the key; without a key they fall back to major/minor shapes) */
function chordPitches(p){const ch=CHORDS[PREFS.chord||'Off'];if(!ch)return[p];
  if(ch.iv)return ch.iv.map(i=>p+i).filter(x=>x<=127);
  const sc=scaleOn();if(!sc)return(ch.deg.length>=4?[0,4,7,11,14]:[0,4,7]).slice(0,ch.deg.length).map(i=>p+i);
  const r=snapToScale(p),pc=((r-S.scale.root)%12+12)%12,i0=sc.indexOf(pc),oct=Math.floor((r-S.scale.root-pc)/12);
  return ch.deg.map(dg=>{const k=i0+dg,o=Math.floor(k/sc.length);return S.scale.root+12*(oct+o)+sc[k%sc.length]}).filter(x=>x<=127)}
function scaleLabel(){const sc=scaleOn();return sc?`${NN[S.scale.root]} ${S.scale.mode}`:'No key'}

/* ================= Session view (Ableton-style clip launching) ================= */
/* Session clips live in t.slots[sceneId]. While a track plays from the session it ignores its arrangement
   clips (SES.override) until "Back to arrangement". Timing uses a session clock (T.nextSB) that never wraps
   with the arrangement loop, so launches stay on the bar grid. */
const SES={segs:new Map(),override:new Set()};
const SSEL={tid:null,sid:null};
function ensureScenes(){if(!Array.isArray(S.scenes)||!S.scenes.length)S.scenes=Array.from({length:8},(_,i)=>({id:uid(),name:String(i+1)}));for(const t of S.tracks)if(t.type!=='return'&&(!t.slots||typeof t.slots!=='object'))t.slots={};return S.scenes}
const sessTracks=()=>S.tracks.filter(t=>t.type!=='return');
const slotOf=(t,sid)=>t&&t.slots&&t.slots[sid]||null;
const slotLoop=c=>c.loopLen>0?c.loopLen:c.length;
function sessNow(){if(!T.playing)return null;const now=ctx.currentTime;let m=null;for(let i=T.marks.length-1;i>=0;i--)if(T.marks[i].t<=now){m=T.marks[i];break}m=m||T.marks[0];if(!m||m.sb==null)return T.nextSB||0;if(now<m.t)return m.sb;return m.sb+(now-m.t)*m.bpm/60}
function launchAt(){const Q=S.launchQ??4,base=T.nextSB||0;return Q>0?Math.ceil((base-1e-6)/Q)*Q:base}
function sbTime(sb){return T.nextTime+(sb-(T.nextSB||0))*60/S.bpm}
function segsOf(tid){let a=SES.segs.get(tid);if(!a){a=[];SES.segs.set(tid,a)}return a}
/* cut a track's session playback at session beat `at` (also silences audio already scheduled past it) */
function cutSegs(tid,at){const a=segsOf(tid);for(let i=a.length-1;i>=0;i--){const s=a[i];if(s.start>=at-1e-9)a.splice(i,1);else if(s.end>at)s.end=at}
  if(!T.playing)return;const time=Math.max(ctx.currentTime,sbTime(at)),now=ctx.currentTime;
  for(const s of engine.srcs){if(!s._sess||s._tid!==tid)continue;try{if(s._t0>=time-1e-4){s.stop();continue}const gg=s._g.gain,t1=Math.max(now,time-.006);gg.cancelScheduledValues(t1);gg.setValueAtTime(s._gain,t1);gg.linearRampToValueAtTime(0,Math.max(t1+.004,time));s.stop(Math.max(t1+.006,time+.005))}catch(e){}}}
function launchSlot(t,sid,o={}){const c=slotOf(t,sid);if(!c)return stopTrack(t,o);if(ctx.state!=='running')ctx.resume();const go=!T.playing;if(go&&o.at==null)T.pos=Math.floor(T.pos/4)*4;
  const at=o.at??(go?T.pos:launchAt());cutSegs(t.id,at);segsOf(t.id).push({clip:c,sid,start:at,end:Infinity});const had=SES.override.has(t.id);SES.override.add(t.id);
  if(go&&!o.noPlay)play();if(!had)renderArr();renderSessState();return at}
function stopTrack(t,o={}){if(!T.playing&&o.at==null){SES.segs.delete(t.id);renderSessState();return}const at=o.at??launchAt();cutSegs(t.id,at);if(!SES.override.has(t.id)){SES.override.add(t.id);renderArr()}renderSessState()}
function launchScene(sid){ensureScenes();const go=!T.playing;if(go)T.pos=Math.floor(T.pos/4)*4;const at=go?T.pos:launchAt();let n=0;
  for(const t of sessTracks()){if(slotOf(t,sid)){launchSlot(t,sid,{at,noPlay:true});n++}else stopTrack(t,{at})}
  if(go)play();renderArr();renderSessState();const s=S.scenes.find(x=>x.id===sid);if(!n)toast(`Scene ${s?s.name:''} is empty: its tracks stop`)}
function stopAllClips(){const at=T.playing?launchAt():null;for(const t of sessTracks()){if(at==null)SES.segs.delete(t.id);else cutSegs(t.id,at)}renderSessState()}
function backToArrangement(){const had=SES.override.size;for(const tid of SES.override)cutSegs(tid,T.playing?T.nextSB:0);SES.segs.clear();SES.override.clear();if(T.playing&&had)T.fresh=true;renderArr();renderSessState();toast('Back to the arrangement: every track plays its arrangement clips again')}
/* keep session clips going when the playhead jumps (seek) */
function sessKeep(){const out=[];for(const[tid,a]of SES.segs){const s=a.filter(x=>x.end===Infinity).pop();if(s)out.push({tid,clip:s.clip,sid:s.sid})}return out}
function sessRestore(list,at){for(const k of list||[])segsOf(k.tid).push({clip:k.clip,sid:k.sid,start:at,end:Infinity})}
/* after undo / reload the clip objects are new: re-point playing segments by clip id */
function sessRemap(){for(const[tid,a]of SES.segs){const t=trackById(tid);if(!t){SES.segs.delete(tid);SES.override.delete(tid);continue}
  for(let i=a.length-1;i>=0;i--){const c=slotOf(t,a[i].sid);if(c&&c.id===a[i].clip.id)a[i].clip=c;else a.splice(i,1)}}for(const tid of[...SES.override])if(!trackById(tid))SES.override.delete(tid)}
function scheduleSession(eng,b0,b1,t0,spb,fresh){if(!SES.segs.size)return;const tt=b=>t0+(b-b0)*spb;eng._sess=true;
  try{for(const t of S.tracks){const a=SES.segs.get(t.id);if(!a||!a.length)continue;
    for(let i=a.length-1;i>=0;i--)if(a[i].end<=b0-1e-9)a.splice(i,1);
    for(const s of a){if(s.start>=b1||s.end<=b0)continue;const c=s.clip,L=slotLoop(c);if(!(L>0))continue;
      const k=Math.max(0,Math.floor((b0-s.start)/L+1e-9)),st=s.start+k*L;const vc={...c,start:st,length:s.end===Infinity?Infinity:s.end-st,loopLen:L};
      scheduleClip(eng,t,vc,b0,b1,tt,spb,fresh&&st<b0,s.end)}}}finally{eng._sess=false}}

/* ---- session editing ---- */
function selectSlot(tid,sid){SSEL.tid=tid;SSEL.sid=sid;const t=trackById(tid),c=slotOf(t,sid);S.sel.track=tid;if(c){S.sel.slot={tid,sid};S.sel.clip=null;CSEL.clear();paintClipSel()}else S.sel.slot=null;
  $$('#sess .slot.sel').forEach(e=>e.classList.remove('sel'));document.querySelector(`#sess .slot[data-tid="${tid}"][data-sid="${sid}"]`)?.classList.add('sel');
  $$('#sess .shead').forEach(e=>e.classList.toggle('sel',e.dataset.tid===tid));$$('.row').forEach(r=>r.classList.toggle('sel',r.dataset.tid===tid));renderDock()}
const sceneIdx=sid=>S.scenes.findIndex(s=>s.id===sid);
function createSlotClip(t,sid){if(t.type!=='midi')return toast('Drag a sample from the browser into this slot');pushUndo();const c={id:uid(),name:`${t.name} ${sceneIdx(sid)+1}`,start:0,length:4,notes:[]};t.slots[sid]=c;
  selectSlot(t.id,sid);S.tab='editor';renderSession();renderDock();touch();toast('New 1-bar clip: draw notes in the editor, then click ▶ to launch it')}
function deleteSlot(t,sid){const c=slotOf(t,sid);if(!c)return;pushUndo();delete t.slots[sid];const a=SES.segs.get(t.id);if(a){const i=a.findIndex(s=>s.clip===c);if(i>=0){cutSegs(t.id,T.playing?T.nextSB:0)}}
  if(S.sel.slot&&S.sel.slot.tid===t.id&&S.sel.slot.sid===sid)S.sel.slot=null;renderSession();renderDock();touch()}
function copySlot(t,sid){const c=slotOf(t,sid);if(!c)return toast('Select a clip to copy');CLIPBOARD={kind:'clips',items:[{tid:t.id,type:t.type,rel:0,clip:structuredClone(c)}]};toast('Copied clip')}
function pasteSlot(t,sid){const it=CLIPBOARD&&CLIPBOARD.kind==='clips'&&CLIPBOARD.items.find(i=>i.type===t.type);if(!it)return toast(CLIPBOARD?'That clip is for a different kind of track':'Copy a clip first');
  pushUndo();const c=structuredClone(it.clip);c.id=uid();c.start=0;delete c.mute;t.slots[sid]=c;selectSlot(t.id,sid);renderSession();touch()}
function dupSlotDown(t,sid){const c=slotOf(t,sid);if(!c)return;let i=sceneIdx(sid)+1;pushUndo();if(i>=S.scenes.length||slotOf(t,S.scenes[i].id)){S.scenes.splice(i,0,{id:uid(),name:String(S.scenes.length+1)})}
  const n=structuredClone(c);n.id=uid();t.slots[S.scenes[i].id]=n;selectSlot(t.id,S.scenes[i].id);renderSession();touch();toast('Duplicated into the next scene')}
function renameSlot(t,sid){const c=slotOf(t,sid);if(!c)return;const el=document.querySelector(`#sess .slot[data-tid="${t.id}"][data-sid="${sid}"] .sl-nm`);if(!el)return;
  const inp=h('input',{value:c.name||'','aria-label':'Clip name',class:'sl-in'});el.replaceChildren(inp);inp.focus();inp.select();
  const done=()=>{const v=inp.value.trim();if(v&&v!==c.name){pushUndo();c.name=v;touch()}renderSession();renderDock()};inp.addEventListener('blur',done);inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=c.name||'';inp.blur()}e.stopPropagation()})}
function slotDrop(t,sid,txt,copy){if(!txt)return;
  if(txt.startsWith('sample:')){const id=txt.slice(7);if(!SAMPLES.has(id))return;if(t.type!=='audio')return toast('Samples go on audio tracks');pushUndo();t.slots[sid]=audioClip(id,0);selectSlot(t.id,sid);renderSession();touch();return}
  if(txt.startsWith('slot:')){const[tid,sid2]=txt.slice(5).split('|'),st=trackById(tid),c=slotOf(st,sid2);if(!c||(st===t&&sid2===sid))return;if(st.type!==t.type)return toast('Clips can only move between tracks of the same kind');
    pushUndo();const n=copy?structuredClone(c):c;if(copy)n.id=uid();else delete st.slots[sid2];t.slots[sid]=n;selectSlot(t.id,sid);renderSession();touch()}}
function addScene(at){pushUndo();ensureScenes();const s={id:uid(),name:String(S.scenes.length+1)};if(at==null)S.scenes.push(s);else S.scenes.splice(at,0,s);renderSession();touch();return s}
function deleteScene(sid){if(S.scenes.length<=1)return toast('A session needs at least one scene');pushUndo();for(const t of sessTracks()){const c=slotOf(t,sid);if(c){const a=SES.segs.get(t.id);if(a&&a.some(s=>s.sid===sid))cutSegs(t.id,T.playing?T.nextSB:0);delete t.slots[sid]}}
  S.scenes=S.scenes.filter(s=>s.id!==sid);renderSession();touch()}
function dupScene(sid){const i=sceneIdx(sid);const ns=addScene(i+1);for(const t of sessTracks()){const c=slotOf(t,sid);if(c){const n=structuredClone(c);n.id=uid();t.slots[ns.id]=n}}ns.name=(S.scenes[i].name||'')+' copy';renderSession();touch()}
function renameScene(sid){const s=S.scenes.find(x=>x.id===sid),el=document.querySelector(`#sess .scene[data-sid="${sid}"] .snm`);if(!s||!el)return;const inp=h('input',{value:s.name,'aria-label':'Scene name',class:'sl-in'});el.replaceChildren(inp);inp.focus();inp.select();
  const done=()=>{const v=inp.value.trim();if(v&&v!==s.name){pushUndo();s.name=v;touch()}renderSession()};inp.addEventListener('blur',done);inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=s.name;inp.blur()}e.stopPropagation()})}
/* write a scene into the arrangement at the playhead (bar), then move the playhead past it */
function sceneToArrangement(sid){const at=Math.floor(T.pos/4)*4,items=sessTracks().map(t=>({t,c:slotOf(t,sid)})).filter(x=>x.c);if(!items.length)return toast('That scene is empty');
  const len=Math.max(4,...items.map(x=>x.c.length));pushUndo();
  for(const{t,c}of items){for(let i=t.clips.length-1;i>=0;i--){const o=t.clips[i];if(o.start>=at-1e-9&&o.start+o.length<=at+len+1e-9)t.clips.splice(i,1);else if(o.start<at&&o.start+o.length>at)o.length=at-o.start}
    const n=structuredClone(c);n.id=uid();n.start=at;n.loopLen=slotLoop(c);n.length=len;t.clips.push(n)}
  T.pos=at+len;renderTransport();commit();const s=S.scenes.find(x=>x.id===sid);toast(`Scene ${s?s.name:''} → bars ${at/4+1}–${(at+len)/4} · playhead moved to the end`)}
/* split the arrangement into 4-bar sections, one scene each */
function fillScenesFromArrangement(silent){ensureScenes();const end=Math.max(16,Math.ceil(songEnd()/16)*16),N=Math.min(16,end/16);if(!silent)pushUndo();while(S.scenes.length<N)S.scenes.push({id:uid(),name:String(S.scenes.length+1)});let made=0;
  for(let k=0;k<N;k++){const a=k*16,b=a+16,sid=S.scenes[k].id;
    for(const t of sessTracks()){if(slotOf(t,sid))continue;
      if(t.type==='midi'){const notes=[];for(const c of t.clips){if(c.mute||c.start>=b||c.start+c.length<=a)continue;for(const n of expandNotes(c)){const s=c.start+n.s;if(s>=a&&s<b)notes.push({p:n.p,s:s-a,l:Math.min(n.l,b-s),v:n.v??.8})}}
        if(notes.length){const rep=L=>notes.every(n=>notes.some(o=>o.p===n.p&&Math.abs(o.s-((n.s+L)%16))<1e-6));let len=16;for(const L of[4,8])if(rep(L)){len=L;break}
          t.slots[sid]={id:uid(),name:`${t.name} ${k+1}`,start:0,length:len,notes:notes.filter(n=>n.s<len)};made++}}
      else{const c=t.clips.find(c=>!c.mute&&c.start<b&&c.start+c.length>a);if(c){const n=structuredClone(c);n.id=uid();n.start=0;const sm=SAMPLES.get(c.sample),L=audioLoopOf(c,sm);
        n.offset=(c.offset||0)+(c.loopLen>0?((a-c.start)%L+L)%L:Math.max(0,a-c.start))*60/S.bpm;n.length=Math.min(16,c.start+c.length-Math.max(a,c.start));if(c.loopLen>0){delete n.loopLen;n.offset=c.offset||0;n.length=Math.min(16,L)}n.name=`${c.name||t.name}`;t.slots[sid]=n;made++}}}}
  if(!silent){renderSession();touch();toast(made?`Made ${made} clips across ${N} scenes from the arrangement`:'The arrangement has nothing to copy yet')}return made}

/* ---- session view rendering ---- */
const TRI=()=>{const s=svgEl('svg',{viewBox:'0 0 10 10','aria-hidden':'true'});s.append(svgEl('path',{d:'M2 1.2 L8.6 5 L2 8.8 Z'}));return s};
function setView(v){if(v!=='session')v='arr';S.view=v;const w=$('.arrwrap');w&&w.classList.toggle('session',v==='session');$('#arr').hidden=v==='session';$('#sess').hidden=v!=='session';if(v!=='session'){const cw=$('.corner')?.offsetWidth;if(cw)HWpx=cw}
  $$('#viewSeg button').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.setAttribute('aria-pressed',String(b.dataset.v===v))});try{localStorage.setItem('patchbay.view',v)}catch(e){}
  if(v==='session')renderSession();else renderArr()}
function drawSlotPreview(cv,t,c){if(!cv.isConnected)return;const W=cv.clientWidth||100,H=cv.clientHeight||16,g=sizeCanvas(cv,W,H);cv.style.width='';cv.style.height='';g.fillStyle='#000';g.globalAlpha=.55;
  if(t.type==='midi'){const L=slotLoop(c),ns=c.notes.filter(n=>n.s<L);if(!ns.length)return;let lo=127,hi=0;for(const n of ns){lo=Math.min(lo,n.p);hi=Math.max(hi,n.p)}const span=Math.max(8,hi-lo+1);
    for(const n of ns)g.fillRect(n.s/L*W,H-2-((n.p-lo+.5)/span)*(H-3),Math.max(1.5,n.l/L*W-1),Math.max(1.5,(H-3)/span))}
  else{const s=SAMPLES.get(c.sample);if(!s)return;const pk=peaks(s),sr=s.buffer.sampleRate,off=c.offset||0,dur=slotLoop(c)*60/S.bpm,mid=H/2;for(let x=0;x<W;x++){const i0=Math.floor((off+x/W*dur)*sr/256),i1=Math.max(i0+1,Math.floor((off+(x+1)/W*dur)*sr/256));let mn=0,mx=0;for(let i=i0;i<i1&&i*2<pk.length;i++){mn=Math.min(mn,pk[2*i]);mx=Math.max(mx,pk[2*i+1])}g.fillRect(x,mid-mx*mid,1,Math.max(1,(mx-mn)*mid))}}}
function slotEl(t,sid){const c=slotOf(t,sid),sel=S.sel.slot&&S.sel.slot.tid===t.id&&S.sel.slot.sid===sid||(!c&&SSEL.tid===t.id&&SSEL.sid===sid);
  const el=h('div',{class:'slot'+(c?' full':'')+(sel?' sel':''),'data-tid':t.id,'data-sid':sid,style:`--c:${t.color}`,draggable:c?'true':'false',title:c?(c.name||'Clip')+' · click ▶ to launch · double-click to edit · drag to move (Ctrl copies)':(t.type==='midi'?'Double-click to make a clip':'Drag a sample here')});
  if(c){const cv=h('canvas',{class:'sl-cv','aria-hidden':'true'});el.append(h('button',{class:'sl-play',title:'Launch clip','aria-label':'Launch '+(c.name||'clip'),onclick:e=>{e.stopPropagation();launchSlot(t,sid)}},TRI()),h('span',{class:'sl-nm'},c.name||'Clip'),cv,h('i',{class:'sl-prog'}));requestAnimationFrame(()=>drawSlotPreview(cv,t,c))}
  else{const rec=SREC&&SREC.t===t&&SREC.sid===sid;if(rec)el.classList.add('recording');
    if(t.type==='midi')el.append(h('button',{class:'sl-rec'+(rec?' on':''),title:rec?'Stop recording and loop it':'Record into this slot (play your keyboard)','aria-label':(rec?'Stop recording ':'Record into ')+t.name,onclick:e=>{e.stopPropagation();rec?sessRecStop():sessRecStart(t,sid)}}));
    el.append(rec?h('span',{class:'sl-nm'},'Recording…'):h('button',{class:'sl-stop',title:'Stop this track','aria-label':'Stop '+t.name,onclick:e=>{e.stopPropagation();stopTrack(t)}}))}
  el.addEventListener('click',e=>{if(e.target.closest('input'))return;selectSlot(t.id,sid)});
  el.addEventListener('dblclick',e=>{if(e.target.closest('button,input'))return;if(!slotOf(t,sid))createSlotClip(t,sid);else{selectSlot(t.id,sid);setTab('editor')}});
  el.addEventListener('contextmenu',e=>{e.preventDefault();selectSlot(t.id,sid);slotMenu(t,sid,e.clientX,e.clientY)});
  el.addEventListener('dragstart',e=>{if(!slotOf(t,sid)){e.preventDefault();return}e.dataTransfer.setData('text/plain','slot:'+t.id+'|'+sid);e.dataTransfer.effectAllowed='copyMove'});
  el.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect=e.ctrlKey||e.metaKey||e.altKey?'copy':'move';el.classList.add('over')});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('over');slotDrop(t,sid,e.dataTransfer.getData('text/plain'),e.ctrlKey||e.metaKey||e.altKey)});
  return el}
function slotMenu(t,sid,x,y){const c=slotOf(t,sid);showMenu(x,y,c?[{head:c.name||'Clip'},
  {label:'Launch',kbd:'Enter',fn:()=>launchSlot(t,sid)},{label:'Stop track',fn:()=>stopTrack(t)},{label:t.type==='midi'?'Edit notes':'Edit clip',fn:()=>{selectSlot(t.id,sid);setTab('editor')}},{label:'Rename',kbd:'Ctrl+R',fn:()=>renameSlot(t,sid)},{sep:1},
  {label:'Duplicate to next scene',kbd:'Ctrl+D',fn:()=>dupSlotDown(t,sid)},{label:'Copy',kbd:'Ctrl+C',fn:()=>copySlot(t,sid)},{label:'Paste',kbd:'Ctrl+V',disabled:!CLIPBOARD,fn:()=>pasteSlot(t,sid)},{sep:1},
  {label:'Delete',kbd:'Del',danger:1,fn:()=>deleteSlot(t,sid)}]:[

    for(const au of Object.values(t.auto||{})){const add=au.pts.filter(p=>p.b>=a&&p.b<b).map(p=>({...p,b:p.b+len}));au.pts.push(...add);au.pts.sort((x,y)=>x.b-y.b)}}
  const nm={id:uid(),b,name:m.name+' 2'};mks().push(nm);mks().sort((x,y)=>x.b-y.b);commit();toast(`Duplicated “${m.name}” (${len/4} bars) right after itself`)}
function deleteSection(m){const[a,b]=sectionOf(m),len=b-a;pushUndo();
  for(const t of S.tracks){t.clips=t.clips.filter(c=>!(c.start>=a-1e-9&&c.start<b-1e-9));for(const c of t.clips)if(c.start<a&&c.start+c.length>a)c.length=Math.max(.25,a-c.start);
    for(const au of Object.values(t.auto||{}))au.pts=au.pts.filter(p=>!(p.b>=a&&p.b<b))}
  S.markers=mks().filter(x=>x!==m);shiftTime(b,-len);commit();toast(`Removed “${m.name}” and closed the gap · Ctrl+Z to undo`)}
function markerMenu(m,x,y){showMenu(x,y,[{head:'Marker: '+m.name},{label:'Jump here',fn:()=>goStart(m.b)},{label:'Rename',fn:()=>renameMarker(m)},{sep:1},
  {label:'Select this section',fn:()=>selectSection(m)},{label:'Duplicate section (insert after)',fn:()=>duplicateSection(m)},{label:'Delete section (close the gap)',danger:1,fn:()=>deleteSection(m)},{sep:1},
  {label:'Remove marker',fn:()=>{pushUndo();S.markers=mks().filter(z=>z!==m);renderArr();touch()}}])}
function renameMarker(m){const inp=h('input',{class:'nm',value:m.name,'aria-label':'Marker name'});modal('Rename marker',h('div',{class:'mbody'},inp),[{label:'Rename',primary:true,fn:()=>{const v=inp.value.trim();if(v){pushUndo();m.name=v;renderArr();touch()}}}]);setTimeout(()=>{inp.focus();inp.select()},30)}
function markerEls(){return mks().map(m=>{const el=h('div',{class:'marker',style:`left:${m.b*S.zoom}px`,title:`${m.name} · click to jump · drag to move · right-click for section tools`,'data-mid':m.id},h('span',{},m.name));
  el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.stopPropagation();e.preventDefault();el.setPointerCapture(e.pointerId);const x0=e.clientX,b0=m.b;let moved=false;
    const mv=ev=>{const dx=ev.clientX-x0;if(!moved&&Math.abs(dx)<4)return;if(!moved){moved=true;pushUndo()}m.b=Math.max(0,Math.round((b0+dx/S.zoom)/(S.snap||1))*(S.snap||1));el.style.left=m.b*S.zoom+'px'};
    const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);if(moved){mks().sort((a,b)=>a.b-b.b);touch()}else goStart(m.b)};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
  el.addEventListener('dblclick',e=>{e.stopPropagation();renameMarker(m)});
  el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();markerMenu(m,e.clientX,e.clientY)});return el})}

/* ================= several projects, saved in this browser ================= */
const PIDX='patchbay.projects',PCUR='patchbay.current',PKEY=id=>'patchbay.p.'+id;
function projIndex(){try{return JSON.parse(localStorage.getItem(PIDX)||'[]')||[]}catch(e){return[]}}
function saveIndex(a){try{localStorage.setItem(PIDX,JSON.stringify(a))}catch(e){}}
function ensurePid(){if(!S.pid){S.pid=uid();try{localStorage.setItem(PCUR,S.pid)}catch(e){}}return S.pid}
function writeProject(){const id=ensurePid();let data;try{data=JSON.stringify(serialize(true));localStorage.setItem(PKEY(id),data)}catch(e){try{data=JSON.stringify(serialize(false));localStorage.setItem(PKEY(id),data);if(!writeProject.warned){writeProject.warned=true;toast('Imported audio is too large to keep in the browser. Use File ▸ Save to keep it in a project file.')}}catch(_){if(!writeProject.full){writeProject.full=true;toast('Browser storage is full: delete old projects in File ▸ Projects, or save to a file')}return}}
  const idx=projIndex().filter(p=>p.id!==id);idx.unshift({id,name:S.name||'Untitled',updated:Date.now(),tracks:S.tracks.length,size:data.length});saveIndex(idx);try{localStorage.setItem(PCUR,id)}catch(e){}}
async function openStoredProject(id){if(id===S.pid)return;writeProject();const raw=localStorage.getItem(PKEY(id));if(!raw)return toast('That project is missing');await loadProject(JSON.parse(raw));S.pid=id;try{localStorage.setItem(PCUR,id)}catch(e){}writeProject();closePresetBrowser();toast('Opened '+S.name)}
function newStoredProject(useDemo){writeProject();if(T.playing)halt();S.pid=null;if(useDemo)demo();else{Object.assign(S,{name:'Untitled',bpm:120,loop:{on:false,start:0,end:16},masterVol:0,tracks:[newTrack('midi',{name:'Synth'}),newTrack('audio',{name:'Audio 2'})],scenes:null,markers:[]});ensureReturns();ensureScenes();S.swing=0;S.sel={track:S.tracks[0].id,clip:null}}
  SES.segs.clear();SES.override.clear();T.pos=0;UNDO.length=0;REDO.length=0;engine.setTempo(S.bpm);ensurePid();$('#projName').value=S.name;renderTransport();commit();writeProject()}
function projectsDialog(){writeProject();const fmt=t=>{const d=new Date(t),now=Date.now(),m=Math.round((now-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':d.toLocaleDateString()};
  const body=h('div',{class:'mbody projs'});const draw=()=>{const idx=projIndex();body.replaceChildren(h('p',{},`Projects are saved automatically in this browser as you work (${idx.length}). To move one to another device, open it and use File ▸ Save.`),
    h('div',{class:'projlist'},...idx.map(p=>{let armed=false;const del=h('button',{class:'btn',onclick:()=>{if(p.id===S.pid)return toast('That project is open: open another one first');if(!armed){armed=true;del.textContent='Delete?';del.classList.add('danger');return}try{localStorage.removeItem(PKEY(p.id))}catch(e){}saveIndex(projIndex().filter(x=>x.id!==p.id));draw()}},'Delete');
      return h('div',{class:'projrow'+(p.id===S.pid?' cur':'')},h('div',{class:'pinfo'},h('b',{},p.name),h('span',{},`${p.tracks||0} tracks · ${fmt(p.updated)} · ${Math.max(1,Math.round((p.size||0)/1024))} KB`)),
        p.id===S.pid?h('span',{class:'pcur'},'Open now'):h('button',{class:'btn primary',onclick:async()=>{$('#modal').hidden=true;await openStoredProject(p.id)}},'Open'),
        h('button',{class:'btn',title:'Make a copy',onclick:()=>{const raw=localStorage.getItem(PKEY(p.id));if(!raw)return;const nid=uid(),o=JSON.parse(raw);o.name=(o.name||'Untitled')+' copy';try{localStorage.setItem(PKEY(nid),JSON.stringify(o));const idx=projIndex();idx.unshift({id:nid,name:o.name,updated:Date.now(),tracks:(o.tracks||[]).length,size:raw.length});saveIndex(idx)}catch(e){toast('Browser storage is full')}draw()}},'Copy'),del)})))};
  draw();modal('Projects',body,[{label:'New empty project',fn:()=>newStoredProject(false)},{label:'New from demo',fn:()=>newStoredProject(true)}])}
async function restoreProjects(){let id=null;try{id=localStorage.getItem(PCUR)}catch(e){}let raw=id&&localStorage.getItem(PKEY(id));
  if(!raw){try{raw=localStorage.getItem('patchbay.project.v1')}catch(e){}id=null}
  if(!raw)return false;await loadProject(JSON.parse(raw));S.pid=id||uid();writeProject();return true}

function revBuf(b){let r=REVBUF.get(b);if(!r){r=reverseBuf(b);REVBUF.set(b,r)}return r}
const clipRate=c=>Math.pow(2,(c.pitch||0)/12);

    T.marks.push({t:T.nextTime,b:T.nextBeat,sb:T.nextSB,bpm:S.bpm});if(T.marks.length>300)T.marks.splice(0,100);
    scheduleRange(engine,T.nextBeat,T.nextBeat+chunk,T.nextTime,spb,T.fresh,{metro:S.metro,limit:looping?L.end:Infinity});T.fresh=false;
    scheduleSession(engine,T.nextSB,T.nextSB+chunk,T.nextTime,spb,T.freshS);T.freshS=false;
    T.nextBeat+=chunk;T.nextTime+=chunk*spb;T.nextSB+=chunk;if(SREC)sessRecTick();

    if(alt){if(code==='Digit1')return run(()=>gridStep(-1,ed));if(code==='Digit2')return run(()=>gridStep(1,ed));if(code==='Digit4')return run(()=>snapToggle(ed));return}

/* ================= boot ================= */
const CSSV={};

  let skin='tape';try{skin=localStorage.getItem('patchbay.skin')||'tape'}catch(e){}if(skin!=='tape')document.documentElement.dataset.skin=skin;
  readCss();buildLibrary();buildMore();buildPacks();genPresets();injectUserPresets();engine=new Engine(ctx);bind();$('#skin').value=skin;

  if(!canSave())for(const id of['#btnSave','#btnExport'])$(id).title="Saving files isn't available in this view";
})();
